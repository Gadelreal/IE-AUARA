troke-linejoin=\"round\"/>\n        \u003c/svg>\n\n        \u003ch2 class=\"card__title\" id=\"reflection-title\">Opening Reflection\u003c/h2>\n        \u003cp class=\"card__text\" id=\"reflection-prompt\">What do you hope to learn or understand better through this case? Are you particularly interested in the point of view of one of the firms, either AUARA as a social enterprise or Hijos de Rivera as a larger, family-owned commercial firm? Consider the stated learning objectives of the case as well as your own interests.\u003c/p>\n\n        \u003cp class=\"limit rw-el\" id=\"reflection-limit\">Max: 250 characters\u003c/p>\n        \u003ctextarea class=\"field rw-el\" id=\"reflection\" name=\"reflection\" maxlength=\"250\"\n                  placeholder=\"Submit your response here\"\n                  aria-labelledby=\"reflection-title\"\n                  aria-describedby=\"reflection-prompt reflection-limit\">\u003c/textarea>\n\n        \u003cdiv class=\"form-actions\">\n          \u003c!-- 1 · Desactivado hasta que haya texto -->\n          \u003cbutton class=\"btn btn--submit\" id=\"btn-submit\" type=\"submit\" disabled>\n            \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" focusable=\"false\" aria-hidden=\"true\">\n            \u003cpath d=\"M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n            \u003cpath d=\"M9.5 8.96533C9.5 8.48805 9.5 8.24941 9.59974 8.11618C9.68666 8.00007 9.81971 7.92744 9.96438 7.9171C10.1304 7.90525 10.3311 8.03429 10.7326 8.29239L15.4532 11.3271C15.8016 11.551 15.9758 11.663 16.0359 11.8054C16.0885 11.9298 16.0885 12.0702 16.0359 12.1946C15.9758 12.337 15.8016 12.449 15.4532 12.6729L10.7326 15.7076C10.3311 15.9657 10.1304 16.0948 9.96438 16.0829C9.81971 16.0726 9.68666 15.9999 9.59974 15.8838C9.5 15.7506 9.5 15.512 9.5 15.0347V8.96533Z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n          \u003c/svg>\n            Submit\n          \u003c/button>\n\n          \u003c!-- 2 · Al enviar: este mensaje ocupa el lugar del botón unos segundos… -->\n          \u003cp class=\"form-done__msg\" id=\"form-done-msg\" tabindex=\"-1\">\n            \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" focusable=\"false\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M7.5 12.5l3 3 6-6.5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003cspan>Your response has been recorded!\u003c/span>\n          \u003c/p>\n\n          \u003c!-- 3 · …y después lo sustituye «Change the answer» (mismo estilo que Submit) -->\n          \u003cbutton class=\"btn btn--change\" id=\"btn-change\" type=\"button\">\n              \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" focusable=\"false\" aria-hidden=\"true\">\u003cpath d=\"M3 12a9 9 0 1 0 3-6.7L3 8\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M3 3v5h5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n              Change the answer\n            \u003c/button>\n        \u003c/div>\n        \u003cp class=\"sr-only\" id=\"reflection-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\n      \u003c/form>\n    \u003c/section>\n\n    \u003c!-- Botones de navegación. En pantallas anchas van fijos en los márgenes inferiores; si no caben\n         sin tocar los módulos, se quedan aquí, centrados BAJO el último módulo. -->\n    \u003cnav class=\"nav-bar\" aria-label=\"Page navigation\">\n  \u003c!-- Vuelta al intro: salta la animación de apertura (el intro lee ?skipIntro=true) -->\n  \u003ca class=\"fab fab--prev\" id=\"btn-prev\" href=\"auara-case-intro.html?skipIntro=true\" aria-label=\"Back to the introduction\">\n    \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M15 5l-7 7 7 7\"/>\u003c/svg>\n  \u003c/a>\n  \u003cbutton class=\"fab fab--pause\" id=\"btn-pause\" type=\"button\" aria-label=\"Pause animation\">\n    \u003csvg id=\"pause-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\">\u003crect x=\"5\" y=\"4\" width=\"4\" height=\"16\" rx=\"1.2\"/>\u003crect x=\"15\" y=\"4\" width=\"4\" height=\"16\" rx=\"1.2\"/>\u003c/svg>\n  \u003c/button>\n  \u003c!-- Siguiente: pon en data-href la URL de la página siguiente cuando exista. Mientras esté vacío se\n       reproduce la transición completa y se emite el evento case:next. -->\n  \u003cbutton class=\"fab fab--next\" id=\"btn-next\" type=\"button\" data-href=\"\" aria-label=\"Next section\">\n    \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M9 5l7 7-7 7\"/>\u003c/svg>\n  \u003c/button>\n    \u003c/nav>\n  \u003c/main>\n\n  \u003cscript>\n  (() => {\n    'use strict';\n\n    /* ========================================================\n       1 · HEADER: contracción progresiva con el scroll\n       --p va de 0 (expandido) a 1 (compacto) en los primeros\n       COLLAPSE_RANGE px de scroll; el CSS interpola alto, logo y \"01\".\n       ======================================================== */\n    const root = document.documentElement;\n    const emit = (name, detail, cancelable) => document.dispatchEvent(new CustomEvent(name, { detail, cancelable: !!cancelable }));\n    const COLLAPSE_RANGE = 120;\n    let scrollTicking = false;\n\n    function applyScroll() {\n      const t = Math.min(1, Math.max(0, window.scrollY / COLLAPSE_RANGE));\n      root.style.setProperty('--p', (t * t * (3 - 2 * t)).toFixed(3)); // smoothstep\n      scrollTicking = false;\n    }\n    window.addEventListener('scroll', () => {\n      if (!scrollTicking) { scrollTicking = true; requestAnimationFrame(applyScroll); }\n    }, { passive: true });\n    applyScroll();\n\n    /* ========================================================\n       2 · AGUA ANIMADA (mismo motor que auara-case-intro.html,\n       sin la secuencia de apertura: aquí solo el loop continuo)\n       ======================================================== */\n    const canvas = document.getElementById('stage');\n    const ctx = canvas.getContext('2d');\n    const btnPause = document.getElementById('btn-pause');\n    const pauseIcon = document.getElementById('pause-icon');\n    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');\n    const HONOR_RM = window.AUARA_HONOR_REDUCED_MOTION === true;   // interruptor (ver la cabecera)\n    const motionCalm = () => HONOR_RM && reduceMotion.matches;      // ¿hay que evitar el movimiento?\n\n    const BG = '#EEF4F3';\n    const MAX_DELTA = 0.05;         // evita saltos al volver de otra pestaña\n\n    let width = 0, height = 0, dpr = 1;\n    let SURF = 0;                   // cota Y del horizonte del agua\n    let animTime = 0, lastTs = performance.now(), frameScale = 1;\n    let rafId = null, paused = false;\n    let waves = [], drops = [], departureWaves = [];\n    let dropAt = 0, dropFired = false;     // la gota cae UNA sola vez, en el instante dropAt (s de animación)\n\n    const lerpFactor = (base) => 1 - Math.pow(1 - base, frameScale);\n\n    /* --- Entrada / salida: el agua cubre la pantalla (misma geometría y curva que la subida del intro) --- */\n    const COVER_DURATION = 1.2;       // s que tarda el agua en subir o bajar\n    const COVER_OVERSHOOT = 120;      // px por encima del borde superior cuando lo cubre todo\n    const cover = { t: 0, dir: 0, hold: 0 };    // t: 0 = reposo · 1 = pantalla cubierta\n    const coverEase = (t) => t \u003c 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\n    const arriving = root.classList.contains('arriving');\n    let readySent = false;\n    if (arriving) {\n      cover.t = 1; cover.dir = -1; cover.hold = 0.15;\n      // Continuidad de las olas: seguir la fase donde las dejó el intro, compensando lo que tardó la navegación\n      const h = window.__AUARA_HANDOFF_DATA;\n      if (h && isFinite(h.t)) animTime = h.t + Math.min(2, Math.max(0, (Date.now() - h.at) / 1000));\n    }\n\n    /* Nivel del agua: el agua CUBRE la mitad inferior de la zona de contenidos.\n       La zona de contenidos es la ventana por debajo del header (expandido). El borde superior MEDIO del\n       agua queda en el punto medio de esa zona, de modo que el agua ocupa su mitad inferior y las crestas\n       suben y bajan alrededor de esa línea.\n       La línea superior del relieve sube de media 16 px sobre su nivel base (medido sobre las fórmulas, con\n       independencia del ancho de pantalla; oscila entre -24 y +57 px el 90 % del tiempo), así que el nivel\n       base se coloca 16 px por debajo del punto medio. */\n    const WATER_COVER = 0.5;      // fracción de la zona de contenidos que cubre el agua (borde medio a la mitad)\n    const MEAN_RISE_PX = 16;      // elevación media de la línea superior del relieve\n    function contentTop() {       // alto del header expandido (variable CSS): ahí empieza la zona de contenidos\n      const v = parseFloat(getComputedStyle(root).getPropertyValue('--hdr-exp'));\n      return Math.min(isFinite(v) ? v : 0, height * 0.4);\n    }\n    function updateSurface() {\n      const top = contentTop();\n      SURF = top + (height - top) * (1 - WATER_COVER) + MEAN_RISE_PX;\n    }\n\n    function resize(force) {\n      const w = canvas.clientWidth, h = canvas.clientHeight;\n      if (!w || !h) return;\n      // En móvil la barra del navegador cambia la altura al hacer scroll: se ignoran cambios pequeños\n      if (!force && w === width && Math.abs(h - height) \u003c 160) { updateSurface(); return; }\n      dpr = Math.min(window.devicePixelRatio || 1, 2);\n      width = w; height = h;\n      canvas.width = Math.round(w * dpr);\n      canvas.height = Math.round(h * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      updateSurface();\n      if (paused) drawStill();\n    }\n\n    /* --- Relieve topográfico marino (idéntico al original) --- */\n    function getTopologicalHeight(x, y, time, progress) {\n      const depth = Math.max(0, y - SURF);\n\n      const s1 = Math.sin(x * 0.0036 - time * 0.95);\n      const wave1 = Math.sign(s1) * Math.pow(Math.abs(s1), 0.68) * (24 * (1 - progress * 0.35));\n\n      const wave2 = Math.cos(x * 0.0078 + time * 1.35 + depth * 0.005) * (14 * (1 - progress * 0.4));\n\n      const phase1 = x * 0.0036 - time * 0.95;\n      const wave3 = Math.sin(x * 0.016 - time * 2.2 + Math.cos(phase1) * 0.8) * (6 * Math.max(0, 1 - progress * 2.2));\n\n      const p1X = width * 0.35 + Math.sin(time * 0.5) * (width * 0.04);\n      const d1x = (x - p1X) / (width * 0.16);\n      const topPeak1 = (36 * Math.max(0, 1 - progress * 2.5)) * Math.exp(-d1x * d1x) * (1 - 0.28 * Math.tanh(2.5 * d1x));\n\n      const p2X = width * 0.77 + Math.cos(time * 0.42) * (width * 0.035);\n      const d2x = (x - p2X) / (width * 0.13);\n      const topPeak2 = (32 * Math.max(0, 1 - progress * 2.5)) * Math.exp(-d2x * d2x) * (1 + 0.32 * Math.tanh(2.8 * d2x));\n\n      const midWeight = Math.sin(progress * Math.PI);\n\n      const pDeepLX = width * 0.28 + Math.sin(time * 0.45 + 1.2) * (width * 0.05);\n      const dDeepLX = (x - pDeepLX) / (width * 0.19);\n      const swellLeft = (46 * midWeight) * Math.exp(-dDeepLX * dDeepLX) * (1 - 0.45 * Math.tanh(3.2 * dDeepLX));\n\n      const pDeepRX = width * 0.65 + Math.cos(time * 0.38 + 2.1) * (width * 0.06);\n      const dDeepRX = (x - pDeepRX) / (width * 0.17);\n      const swellRight = (42 * midWeight) * Math.exp(-dDeepRX * dDeepRX) * (1 + 0.38 * Math.tanh(2.6 * dDeepRX));\n\n      const depthHarmonic = Math.sin(x * 0.0055 + progress * 5.0 - time * 0.9) * (12 * midWeight);\n\n      return wave1 + wave2 + wave3 + topPeak1 + topPeak2 + swellLeft + swellRight + depthHarmonic;\n    }\n\n    const curvedSurfaceY = (x) => SURF - getTopologicalHeight(x, SURF, animTime, 0);\n\n    /* --- Onda de impacto --- */\n    /* Ondas de salida: anillos blancos que parten del botón pulsado (idénticas a las del botón Start del intro) */\n    class DepartureWave {\n      constructor(originX, originY) {\n        this.originX = originX; this.originY = originY;\n        this.radius = 0;\n        this.maxRadius = Math.max(width, height) * 2.2;\n        this.speed = 460;                 // px/s: las palabras se ondulan sincronizadas con este avance\n        this.age = 0; this.maxAge = 3.0;\n      }\n      update(delta) {\n        this.age += delta; this.radius += this.speed * delta;\n        return this.age \u003c this.maxAge && this.radius \u003c this.maxRadius;\n      }\n      draw(c) {\n        if (this.radius \u003c= 4) return;\n        const life = Math.max(0, 1 - this.age / this.maxAge);\n        if (life \u003c= 0.005) return;\n        c.save();\n        const rings = [\n          { rOffset: -30, width: 20, alpha: 0.38 },\n          { rOffset: 0,   width: 9,  alpha: 0.95 },\n          { rOffset: 32,  width: 38, alpha: 0.25 },\n          { rOffset: 70,  width: 55, alpha: 0.12 }\n        ];\n        for (const r of rings) {\n          const rr = this.radius + r.rOffset;\n          if (rr \u003c= 2) continue;\n          const a = r.alpha * Math.pow(life, 0.85);\n          if (a \u003c= 0.004) continue;\n          c.beginPath(); c.arc(this.originX, this.originY, rr, 0, Math.PI * 2);\n          c.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, a)})`; c.lineWidth = r.width; c.stroke();\n        }\n        c.restore();\n      }\n    }\n\n    class DistortionWave {\n      constructor(originX, originY, intensity) {\n        this.originX = originX; this.originY = originY;\n        this.radius = 0;\n        this.maxRadius = Math.max(width, height) * 1.15;\n        this.speed = 220;\n        this.ringWidth = 150;\n        this.intensity = intensity;\n        this.age = 0;\n        this.maxAge = 2.8;\n        this.minRSq = 0; this.maxRSq = 150 * 150;\n      }\n      update(delta) {\n        this.age += delta;\n        this.radius += this.speed * delta;\n        const minR = Math.max(0, this.radius - this.ringWidth);\n        const maxR = this.radius + this.ringWidth;\n        this.minRSq = minR * minR; this.maxRSq = maxR * maxR;\n        return this.age \u003c this.maxAge && this.radius \u003c this.maxRadius;\n      }\n      getOffset(x, y) {\n        const dx = x - this.originX, dy = y - this.originY;\n        const distSq = dx * dx + dy * dy;\n        if (distSq \u003c this.minRSq || distSq > this.maxRSq) return 0;\n        const dist = Math.sqrt(distSq);\n        const fromFront = dist - this.radius;\n        const norm = Math.abs(fromFront) / this.ringWidth;\n        const envelope = 0.5 * (1 + Math.cos(norm * Math.PI));\n        const wave = -Math.sin((fromFront / this.ringWidth) * Math.PI * 2) * envelope;\n        const life = Math.max(0, 1 - this.age / this.maxAge);\n        return wave * 18 * this.intensity * Math.pow(life, 1.2);\n      }\n      drawRings(c, waterTopY) {\n        if (this.radius \u003c= 6) return;\n        const life = Math.max(0, 1 - this.age / this.maxAge);\n        if (life \u003c= 0.006) return;\n        c.save();\n        c.beginPath();\n        c.rect(-500, waterTopY - 120, width + 1000, height + 1400);\n        c.clip();\n        const stripes = [\n          { r: -24, w: 14, a: 0.28 },\n          { r: 0,   w: 7,  a: 0.70 },\n          { r: 26,  w: 26, a: 0.16 }\n        ];\n        for (const s of stripes) {\n          const r = this.radius + s.r;\n          if (r \u003c= 2) continue;\n          const a = s.a * Math.pow(life, 1.15) * Math.min(1.2, this.intensity);\n          if (a \u003c= 0.005) continue;\n          c.beginPath();\n          c.arc(this.originX, this.originY, r, 0, Math.PI * 2);\n          c.strokeStyle = `rgba(255,255,255,${Math.min(1, a)})`;\n          c.lineWidth = s.w;\n          c.stroke();\n        }\n        c.restore();\n      }\n    }\n\n    /* --- Gota plana AUARA --- */\n    function drawFlatWaterDrop(c, x, y, size, stretch, color) {\n      c.save();\n      c.translate(x, y);\n      c.scale(1 / Math.sqrt(stretch), stretch);\n      c.fillStyle = color;\n      c.beginPath();\n      const tipR = size * 0.12, topY = -size * 1.65;\n      c.moveTo(-tipR, topY + tipR);\n      c.arc(0, topY + tipR, tipR, Math.PI, 0, false);\n      c.bezierCurveTo(size * 0.25, -size * 0.9, size * 0.98, -size * 0.05, size, size * 0.5);\n      c.arc(0, size * 0.5, size, 0, Math.PI, false);\n      c.bezierCurveTo(-size * 0.98, -size * 0.05, -size * 0.25, -size * 0.9, -tipR, topY + tipR);\n      c.closePath();\n      c.fill();\n      c.restore();\n    }\n\n    class FlatDrop {\n      constructor(x, y, targetY) {\n        this.x = x; this.y = y; this.targetY = targetY;\n        this.vy = 1.8; this.gravity = 0.48; this.size = 10; this.stretch = 1;\n      }\n      update() {\n        this.vy += this.gravity * frameScale;\n        this.y += this.vy * frameScale;\n        this.stretch = Math.min(1.45, 1 + this.vy * 0.028);\n        if (this.y >= this.targetY) {\n          waves.push(new DistortionWave(this.x, this.targetY, 1.25));\n          return false;\n        }\n        return true;\n      }\n      draw() { drawFlatWaterDrop(ctx, this.x, this.y, this.size, this.stretch, '#00AFAF'); }\n    }\n\n    /* --- Pintado de las líneas de agua --- */\n    /* ========================================================\n       RELIEVE POR COLUMNAS\n       La mayor parte de getTopologicalHeight depende solo de x y del tiempo, no de la\n       línea. Antes se recalculaba 48 veces por columna y fotograma (~12.000 llamadas con\n       senos, exponenciales y tangentes hiperbólicas). Ahora esas partes se calculan UNA vez\n       por columna (~250) y cada línea solo las combina con sus pesos. El resultado es\n       matemáticamente idéntico: la fase que sí depende de la profundidad se separa con\n       identidades de suma de ángulos (cos(A+B), sin(A+B)).\n       ======================================================== */\n    let rcN = 0, rcW1, rcCos2, rcSin2, rcW3, rcPk1, rcPk2, rcSwL, rcSwR, rcCos5, rcSin5;\n    let ptsY = new Float64Array(0);     // se reutiliza: ya no se crean ~12.000 objetos {x,y} por fotograma\n\n    function buildReliefColumns(n, x0, stepX, time) {\n      if (n > rcN) {\n        rcN = n;\n        rcW1 = new Float64Array(n); rcCos2 = new Float64Array(n); rcSin2 = new Float64Array(n);\n        rcW3 = new Float64Array(n); rcPk1 = new Float64Array(n); rcPk2 = new Float64Array(n);\n        rcSwL = new Float64Array(n); rcSwR = new Float64Array(n);\n        rcCos5 = new Float64Array(n); rcSin5 = new Float64Array(n);\n      }\n      const p1X = width * 0.35 + Math.sin(time * 0.5) * (width * 0.04);\n      const p2X = width * 0.77 + Math.cos(time * 0.42) * (width * 0.035);\n      const pLX = width * 0.28 + Math.sin(time * 0.45 + 1.2) * (width * 0.05);\n      const pRX = width * 0.65 + Math.cos(time * 0.38 + 2.1) * (width * 0.06);\n      const w1 = width * 0.16, w2 = width * 0.13, wL = width * 0.19, wR = width * 0.17;\n      for (let j = 0; j \u003c n; j++) {\n        const x = x0 + j * stepX;\n        const phase1 = x * 0.0036 - time * 0.95;\n        const s1 = Math.sin(phase1);\n        rcW1[j] = Math.sign(s1) * Math.pow(Math.abs(s1), 0.68);\n        const a2 = x * 0.0078 + time * 1.35;\n        rcCos2[j] = Math.cos(a2); rcSin2[j] = Math.sin(a2);\n        rcW3[j] = Math.sin(x * 0.016 - time * 2.2 + Math.cos(phase1) * 0.8);\n        const d1 = (x - p1X) / w1; rcPk1[j] = Math.exp(-d1 * d1) * (1 - 0.28 * Math.tanh(2.5 * d1));\n        const d2 = (x - p2X) / w2; rcPk2[j] = Math.exp(-d2 * d2) * (1 + 0.32 * Math.tanh(2.8 * d2));\n        const dL = (x - pLX) / wL; rcSwL[j] = Math.exp(-dL * dL) * (1 - 0.45 * Math.tanh(3.2 * dL));\n        const dR = (x - pRX) / wR; rcSwR[j] = Math.exp(-dR * dR) * (1 + 0.38 * Math.tanh(2.6 * dR));\n        const a5 = x * 0.0055 - time * 0.9;\n        rcCos5[j] = Math.cos(a5); rcSin5[j] = Math.sin(a5);\n      }\n    }\n\n    // Elevación de UNA línea (equivale a getTopologicalHeight(x, baseY, time, progress) en todas las columnas)\n    function fillLineElevation(out, n, progress, baseY, refSurfaceY) {\n      const mid = Math.sin(progress * Math.PI);\n      const a1 = 24 * (1 - progress * 0.35);\n      const a2 = 14 * (1 - progress * 0.4);\n      const a3 = 6 * Math.max(0, 1 - progress * 2.2);\n      const peak = Math.max(0, 1 - progress * 2.5);\n      const aP1 = 36 * peak, aP2 = 32 * peak;\n      const aL = 46 * mid, aR = 42 * mid, aH = 12 * mid;\n      const B2 = Math.max(0, baseY - refSurfaceY) * 0.005;\n      const cB2 = Math.cos(B2), sB2 = Math.sin(B2);\n      const B5 = progress * 5.0;\n      const cB5 = Math.cos(B5), sB5 = Math.sin(B5);\n      for (let j = 0; j \u003c n; j++) {\n        let e = a1 * rcW1[j]\n              + a2 * (rcCos2[j] * cB2 - rcSin2[j] * sB2)\n              + aH * (rcSin5[j] * cB5 + rcCos5[j] * sB5);\n        if (a3 > 0) e += a3 * rcW3[j];\n        if (peak > 0) e += aP1 * rcPk1[j] + aP2 * rcPk2[j];\n        if (mid > 0) e += aL * rcSwL[j] + aR * rcSwR[j];\n        out[j] = e;\n      }\n    }\n\n    function drawWater() {\n      const topY = SURF - coverEase(cover.t) * (SURF + COVER_OVERSHOOT);\n      const bottomY = height + 40;\n      const totalLines = 48;\n      const stepY = (bottomY - topY) / (totalLines - 1);\n      const stepX = width \u003c 768 ? 9 : 6;\n      const n = Math.floor((width + 80) / stepX) + 1;\n      if (ptsY.length \u003c n) ptsY = new Float64Array(n);\n\n      ctx.lineCap = 'round';\n      ctx.lineJoin = 'round';\n\n      // Partes del relieve que no dependen de la línea: una vez por columna y fotograma\n      buildReliefColumns(n, -40, stepX, animTime);\n\n      for (let i = 0; i \u003c totalLines; i++) {\n        const baseY = topY + i * stepY;\n        const progress = i / (totalLines - 1);\n        const damp = Math.max(0, 1 - Math.pow(progress, 2.8));\n\n        fillLineElevation(ptsY, n, progress, baseY, SURF);\n        for (let j = 0; j \u003c n; j++) {\n          const x = -40 + j * stepX;\n          let y = baseY - ptsY[j] * damp;\n          for (let k = 0; k \u003c waves.length; k++) y += waves[k].getOffset(x, y);\n          ptsY[j] = y;\n        }\n\n        // La curva se construye una sola vez; el área de relleno es una copia con el cierre\n        const curve = new Path2D();\n        curve.moveTo(-40, ptsY[0]);\n        for (let j = 1; j \u003c n; j++) curve.lineTo(-40 + j * stepX, ptsY[j]);\n        const area = new Path2D(curve);\n        area.lineTo(width + 80, height + 300);\n        area.lineTo(-80, height + 300);\n        area.closePath();\n\n        ctx.fillStyle = BG;\n        ctx.fill(area);                                   // oculta las líneas de detrás\n        ctx.lineWidth = 0.7 + Math.pow(progress, 1.2) * 10.3;\n        ctx.strokeStyle = `rgb(0, ${Math.round(175 - progress * 35)}, ${Math.round(175 - progress * 15)})`;\n        ctx.stroke(curve);\n      }\n      for (const w of waves) w.drawRings(ctx, topY);\n    }\n\n    /* --- Fotograma --- */\n    function render(now, still) {\n      const delta = still ? 0 : Math.min(Math.max((now - lastTs) / 1000, 0), MAX_DELTA);\n      lastTs = now;\n      frameScale = delta * 60;\n      animTime += delta;\n\n      if (cover.dir !== 0 && !still) {\n        if (cover.hold > 0) {\n          cover.hold -= delta;\n        } else {\n          cover.t = Math.min(1, Math.max(0, cover.t + cover.dir * delta / COVER_DURATION));\n          if (cover.dir \u003c 0 && cover.t \u003c= 0) {          // el agua ya está en reposo\n            cover.dir = 0;\n            dropAt = animTime + 1.0;                       // la gota única cae ~1 s después\n            emit('case:arrived');\n          }\n        }\n      }\n\n      ctx.clearRect(0, 0, width, height);\n\n      if (!still && !dropFired && cover.t === 0 && cover.dir === 0 && animTime >= dropAt) {\n        dropFired = true;                                 // una sola vez por visita: no se repite\n        drops.push(new FlatDrop(width / 2, -50, curvedSurfaceY(width / 2)));\n      }\n      for (let i = waves.length - 1; i >= 0; i--) if (!waves[i].update(delta)) waves.splice(i, 1);\n\n      drawWater();\n\n      for (let i = departureWaves.length - 1; i >= 0; i--) {\n        if (!departureWaves[i].update(delta)) departureWaves.splice(i, 1); else departureWaves[i].draw(ctx);\n      }\n\n      for (let i = drops.length - 1; i >= 0; i--) {\n        if (!drops[i].update()) drops.splice(i, 1); else drops[i].draw();\n      }\n\n      if (!readySent) { readySent = true; emit('case:ready'); }   // ya hay un primer fotograma dibujado\n    }\n\n    function loop(now) { render(now, false); rafId = requestAnimationFrame(loop); }\n    function startLoop() {\n      if (rafId !== null) return;\n      lastTs = performance.now();\n      rafId = requestAnimationFrame(loop);\n    }\n    function stopLoop() {\n      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }\n    }\n    function drawStill() { lastTs = performance.now(); render(lastTs, true); }\n\n    /* --- Pausa (WCAG 2.2.2) --- */\n    const ICON_PAUSE = '\u003crect x=\"5\" y=\"4\" width=\"4\" height=\"16\" rx=\"1.2\"/>\u003crect x=\"15\" y=\"4\" width=\"4\" height=\"16\" rx=\"1.2\"/>';\n    const ICON_PLAY = '\u003cpath d=\"M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z\"/>';\n\n    function setPaused(p) {\n      paused = p;\n      btnPause.setAttribute('aria-label', p ? 'Play animation' : 'Pause animation');\n      pauseIcon.innerHTML = p ? ICON_PLAY : ICON_PAUSE;\n      if (p) { cover.t = 0; cover.dir = 0; root.classList.remove('arriving'); stopLoop(); drawStill(); } else { startLoop(); }\n    }\n    btnPause.addEventListener('click', () => setPaused(!paused));\n    reduceMotion.addEventListener('change', (e) => { if (HONOR_RM) setPaused(e.matches); });\n\n    window.addEventListener('resize', () => resize(false));\n    window.addEventListener('orientationchange', () => setTimeout(() => resize(true), 250));\n\n    resize(true);\n    dropAt = animTime + 1.2;                        // la gota única cae ~1,2 s tras cargar\n    drawStill();                                    // primer fotograma dibujado antes del primer pintado: sin parpadeo\n    if (arriving) setTimeout(() => root.classList.remove('arriving'), 2800);   // fin de la cascada de entrada\n    setPaused(motionCalm());\n\n    /* ========================================================\n       3 · EVENTOS PARA CONECTAR CON TU APP\n       ======================================================== */\n    document.getElementById('btn-menu').addEventListener('click', () => emit('case:menu'));\n    document.getElementById('btn-watch').addEventListener('click', () => emit('case:watch'));\n\n    /* --- Navegación con handoff de las olas (tu app puede interceptarla con case:navigate) --- */\n    function navigateTo(href, skip) {\n      const handoff = { t: animTime, at: Date.now(), skip: !!skip };\n      try { sessionStorage.setItem('auara-water-handoff', JSON.stringify(handoff)); } catch (e) {}\n      // Cancelable: tu app puede interceptar la navegación (router propio, otra transición…)\n      const proceed = emit('case:navigate', { href, handoff }, true);\n      if (proceed) window.location.href = href;\n    }\n\n    /* --- Texto troceado en palabras (solo se envuelven; el contenido y el aspecto no cambian) --- */\n    function splitWords(el) {\n      const base = getComputedStyle(el).color;\n      (function walk(node) {\n        for (const child of Array.from(node.childNodes)) {\n          if (child.nodeType === 3) {\n            const txt = child.textContent;\n            if (!txt.trim()) continue;\n            const frag = document.createDocumentFragment();\n            txt.split(/(\\s+)/).forEach((part) => {\n              if (!part) return;\n              if (/^\\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }\n              const sp = document.createElement('span');\n              sp.className = 'rw'; sp.textContent = part; sp.style.setProperty('--rw-c', base);\n              frag.appendChild(sp);\n            });\n            node.replaceChild(frag, child);\n          } else if (child.nodeType === 1 && !/^(svg|textarea|script|style)$/i.test(child.tagName)) {\n            walk(child);\n          }\n        }\n      })(el);\n    }\n    document.querySelectorAll('.case-title, .card__title, .card__text, .tl__year, .tl__desc, .btn').forEach(splitWords);\n\n    /* ========================================================\n       TRANSICIÓN ENTRE PÁGINAS — la misma que el botón Start del intro. Se usa SIEMPRE al cambiar de página.\n         0 ms     pulso del botón + 3 anillos de onda que salen de él a 460 px/s; el contenido se ondula\n                  palabra a palabra según su distancia al botón\n         150 ms   el contenido se desvanece\n         850 ms   los controles se desvanecen y el agua sube hasta cubrir la pantalla (1,2 s)\n         2250 ms  se navega con el agua cubriéndolo todo (la otra página arranca con ese fotograma)\n       Sin destino (botón \"siguiente\" aún sin página): se completa el ciclo, el agua baja y se emite case:next.\n       ======================================================== */\n    const PT = { fade: 150, rise: 850, go: 2250 };\n    let transitioning = false;\n\n    let resumedForTransition = false;   // el fondo estaba en pausa y se reanudó solo para esta transición\n\n    function endTransition() {\n      root.classList.remove('pt-lock', 'pt-fade', 'pt-controls');\n      document.querySelectorAll('.rw-run').forEach((el) => el.classList.remove('rw-run'));\n      document.querySelectorAll('.launching').forEach((el) => el.classList.remove('launching'));\n      departureWaves = [];\n      transitioning = false;\n      if (resumedForTransition) {       // se devuelve el fondo a su estado: en pausa (y quieto)\n        resumedForTransition = false;\n        if (paused) { stopLoop(); drawStill(); }\n      }\n    }\n\n    function pageTransition(originEl, href) {\n      if (transitioning) return;\n      transitioning = true;\n      // «Reducir movimiento» (preferencia del sistema): sin animación, directo.\n      if (motionCalm()) {\n        if (href) navigateTo(href, true); else { emit('case:next'); transitioning = false; }\n        return;\n      }\n      // Pausa manual: pausa el movimiento AUTOMÁTICO del fondo, pero cambiar de página es una acción del usuario y\n      // lleva siempre esta transición. Con el fondo en pausa se reanuda solo mientras dura la transición\n      // (si no, el botón parecería muerto) y al terminar vuelve a quedar en pausa.\n      if (paused) { resumedForTransition = true; startLoop(); }\n      root.classList.remove('arriving');\n      root.classList.add('pt-lock');\n      originEl.classList.add('launching');\n\n      const r = originEl.getBoundingClientRect();\n      const ox = r.left + r.width / 2, oy = r.top + r.height / 2;\n\n      // 1 · anillos blancos que salen del botón\n      departureWaves.push(new DepartureWave(ox, oy));\n      setTimeout(() => departureWaves.push(new DepartureWave(ox, oy)), 180);\n      setTimeout(() => departureWaves.push(new DepartureWave(ox, oy)), 380);\n\n      // 2 · el contenido se ondula al paso de la onda (retardo = distancia / velocidad)\n      document.querySelectorAll('.rw, .rw-el').forEach((el) => {\n        const b = el.getBoundingClientRect();\n        const d = Math.hypot(b.left + b.width / 2 - ox, b.top + b.height / 2 - oy);\n        el.style.setProperty('--rw-delay', (d / 460).toFixed(3) + 's');\n        el.classList.add('rw-run');\n      });\n\n      // 3 · el contenido se desvanece; luego los controles y el agua sube\n      setTimeout(() => root.classList.add('pt-fade'), PT.fade);\n      setTimeout(() => { root.classList.add('pt-controls'); cover.dir = 1; cover.hold = 0; }, PT.rise);\n\n      // 4 · con el agua cubriéndolo todo\n      setTimeout(() => {\n        if (href) { navigateTo(href, false); return; }\n        emit('case:next');\n        setTimeout(() => {                              // sin página siguiente todavía: el agua baja y vuelve el contenido\n          cover.dir = -1; cover.hold = 0;\n          root.classList.remove('pt-fade', 'pt-controls');\n          setTimeout(endTransition, Math.round(COVER_DURATION * 1000) + 500);\n        }, 250);\n      }, PT.go);\n    }\n\n    const btnPrev = document.getElementById('btn-prev');\n    btnPrev.addEventListener('click', (e) => {\n      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // nueva pestaña: comportamiento nativo\n      e.preventDefault();\n      pageTransition(btnPrev, btnPrev.getAttribute('href'));\n    });\n    const btnNext = document.getElementById('btn-next');\n    btnNext.addEventListener('click', () => pageTransition(btnNext, btnNext.dataset.href || ''));\n\n    // Al volver con \"Atrás\" (bfcache) la página se restaura tal cual: dejarla en reposo\n    window.addEventListener('pageshow', (e) => {\n      if (!e.persisted) return;\n      cover.t = 0; cover.dir = 0; cover.hold = 0;\n      root.classList.remove('arriving');\n      endTransition();\n    });\n\n    /* ========================================================\n       4 · TIMELINE — los hitos aparecen al hacerse visibles en el viewport: cae la gota y llega su contenido.\n       Una sola vez por hito. Sin IntersectionObserver o con «reducir movimiento», todo se ve ya, sin animar.\n       ======================================================== */\n    (function timeline() {\n      const card = document.querySelector('.card--timeline');\n      if (!card) return;\n      const list = card.querySelector('.tl__list');\n      const events = Array.from(list.children);\n\n      // El eje punteado llega hasta el centro de la última gota (con otros textos, otra altura)\n      function fitAxis() {\n        const last = events[events.length - 1], drop = last && last.querySelector('.tl__drop');\n        if (!drop) return;\n        list.style.setProperty('--axis-end', Math.max(0, last.offsetHeight - (drop.offsetTop + drop.offsetHeight / 2)).toFixed(1) + 'px');\n      }\n      fitAxis();\n      window.addEventListener('resize', fitAxis);\n      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAxis);\n      if (window.ResizeObserver) new ResizeObserver(fitAxis).observe(list);\n\n      if (motionCalm() || !('IntersectionObserver' in window)) return;\n      card.classList.add('tl--anim');                    // los hitos parten ocultos\n\n      // Los hitos que entran a la vez caen de arriba abajo, escalonados (0,14 s entre cada uno)\n      const io = new IntersectionObserver((entries) => {\n        entries.filter((e) => e.isIntersecting).map((e) => e.target)\n          .sort((a, b) => events.indexOf(a) - events.indexOf(b))\n          .forEach((el, i) => { el.style.setProperty('--tl-d', (i * 0.14).toFixed(2) + 's'); el.classList.add('is-in'); io.unobserve(el); });\n      }, { threshold: 0.6, rootMargin: '0px 0px -6% 0px' });\n\n      // Al llegar desde el intro, las tarjetas aparecen en cascada de arriba abajo. Los hitos NO empiezan hasta que\n      // esta tarjeta ha aparecido (si no, se animarían sin verse mientras la tarjeta aún es invisible).\n      let started = false;\n      const start = () => { if (started) return; started = true; events.forEach((ev) => io.observe(ev)); };\n      if (!root.classList.contains('arriving')) start();\n      else {\n        card.addEventListener('animationend', (e) => { if (e.target === card) start(); });\n        new MutationObserver(() => { if (!root.classList.contains('arriving')) start(); })\n          .observe(root, { attributes: true, attributeFilter: ['class'] });\n      }\n    })();\n\n    /* ========================================================\n       5 · EJERCICIO · Opening Reflection\n       Inicio (idle): «Submit» desactivado hasta que el usuario escribe texto.\n       Al enviar (sent): 3 ondas de gota en las curvas del agua y, en el lugar del botón, el mensaje\n       «Your response has been recorded!» durante SENT_MSG_MS.\n       Después (done): el mensaje se sustituye por «Change the answer» (mismo estilo que Submit), que\n       devuelve el ejercicio a su estado inicial (campo vacío y editable, «Submit» desactivado).\n       «Max: 250 characters» cuenta los caracteres escritos e impide escribir más de 250.\n       Eventos para tu app: case:reflection-submit {value} · case:reflection-reset\n       ======================================================== */\n    const form = document.getElementById('reflection-form');\n    const field = document.getElementById('reflection');\n    const btnSubmit = document.getElementById('btn-submit');\n    const btnChange = document.getElementById('btn-change');\n    const msgEl = document.getElementById('form-done-msg');\n    const statusEl = document.getElementById('reflection-status');\n    const limitEl = document.getElementById('reflection-limit');\n\n    const LIMIT = 250;                                  // caracteres máximos (igual que maxlength en el HTML)\n    const SENT_MSG_MS = 3000;                           // cuánto tiempo se muestra el mensaje antes de «Change the answer»\n    const limitIdle = limitEl.textContent.trim();       // «Max: 250 characters»\n    let atLimit = false, sentTimer = 0;\n\n    /* Contador: vacío → «Max: 250 characters»; con texto → «n / 250 characters».\n       El límite lo impone maxlength (al escribir y al pegar); aquí se refuerza por si el navegador deja\n       pasar texto (autocompletado, IME) y se avisa a los lectores de pantalla UNA vez al llegar al tope. */\n    function syncCount() {\n      if (field.value.length > LIMIT) {\n        let v = field.value.slice(0, LIMIT);\n        if (/[\\uD800-\\uDBFF]$/.test(v)) v = v.slice(0, -1);   // no partir un carácter de dos unidades (emoji)\n        field.value = v;\n      }\n      const n = field.value.length;\n      limitEl.textContent = n === 0 ? limitIdle : n + ' / ' + LIMIT + ' characters';\n      limitEl.classList.toggle('is-full', n >= LIMIT);\n      if (n >= LIMIT && !atLimit) statusEl.textContent = 'Character limit reached: ' + LIMIT + ' of ' + LIMIT + '.';\n      else if (n \u003c LIMIT && atLimit) statusEl.textContent = '';\n      atLimit = n >= LIMIT;\n    }\n    const syncSubmit = () => { btnSubmit.disabled = field.value.trim().length === 0; };\n    field.addEventListener('input', () => { syncCount(); syncSubmit(); });\n    syncCount(); syncSubmit();                          // también si el navegador restaura el texto al recargar\n\n    // 3 ondas de impacto de gota sobre las curvas del agua: repartidas por el ancho y escalonadas\n    const SUBMIT_WAVES = [{ x: 0.16, at: 0 }, { x: 0.50, at: 180 }, { x: 0.84, at: 360 }];\n    function dropWaves() {\n      if (paused || motionCalm()) return;               // sin animación en pausa o (si se respeta) con «reducir movimiento»\n      SUBMIT_WAVES.forEach(({ x, at }) => setTimeout(() => {\n        if (paused || motionCalm()) return;\n        const px = width * x;\n        waves.push(new DistortionWave(px, curvedSurfaceY(px), 1.25));\n      }, at));\n    }\n\n    form.addEventListener('submit', (e) => {\n      e.preventDefault();\n      if (form.dataset.state !== 'idle') return;        // ya enviado: se ignora\n      const value = field.value.trim();\n      if (!value) { field.focus(); return; }            // el botón ya está desactivado: protección extra\n      form.dataset.state = 'sent';\n      field.readOnly = true;\n      dropWaves();\n      msgEl.focus({ preventScroll: true });             // «Submit» desaparece: el foco pasa al mensaje (se lee en voz alta)\n      emit('case:reflection-submit', { value });\n\n      clearTimeout(sentTimer);\n      sentTimer = setTimeout(() => {                    // el mensaje es temporal: lo sustituye «Change the answer»\n        if (form.dataset.state !== 'sent') return;\n        const a = document.activeElement;\n        const focusWasOnMessage = !a || a === document.body || a === msgEl;\n        form.dataset.state = 'done';\n        if (focusWasOnMessage) btnChange.focus({ preventScroll: true });\n      }, SENT_MSG_MS);\n    });\n\n    btnChange.addEventListener('click', () => {\n      clearTimeout(sentTimer);\n      form.dataset.state = 'idle';\n      field.readOnly = false;\n      field.value = '';\n      syncCount(); syncSubmit();\n      statusEl.textContent = 'The answer was cleared. You can write a new response.';\n      field.focus();\n      emit('case:reflection-reset');\n    });\n  })();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"
    };
    var BUILD = "AUARA Case · 13 Oct 2026";
    var TITLES = { intro: 'AUARA case — introduction', study: 'AUARA case — welcome and opening reflection' };

    var stage = document.getElementById('stage');
    var pageBtns = document.querySelectorAll('[data-page]');
    var sizeBtns = document.querySelectorAll('[data-width]');
    var current = null, pending = null, currentName = null;
    var introBuild = 'after';                              // after | before
    var tests = { perf: false, dpr1: false, norings: false, norays: false };
    var motion = 'full';                                   // full | system | reduced
    var motionBtns = document.querySelectorAll('[data-motion]');
    var systemReduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    // Fuerza el ajuste de movimiento DENTRO de las páginas (CSS y JS) sin tocar su código fuente:
    // 'full' vuelve falsa la consulta; 'reduced' la vuelve verdadera; 'system' la deja como está.
    function applyMotion(html) {
      if (motion === 'full') return html.split('prefers-reduced-motion: reduce').join('min-width: 99999px');
      if (motion === 'reduced') return html.split('prefers-reduced-motion: reduce').join('min-width: 0px');
      return html;
    }

    document.getElementById('build').textContent = BUILD;

    function syncPageButtons() {
      for (var i = 0; i < pageBtns.length; i++) {
        pageBtns[i].setAttribute('aria-pressed', String(pageBtns[i].getAttribute('data-page') === currentName));
      }
    }

    /* Contador de rendimiento que se inyecta DENTRO de la página (no modifica sus archivos).
       Mide el tiempo entre fotogramas con su propio requestAnimationFrame y, al detectar el impacto
       de la gota (aparece la primera onda de distorsión), resume los 2 s anteriores y 4,5 s posteriores. */
    function auaraHud() {
      var label = window.__AUARA_PERF_LABEL || '';
      var el = document.createElement('div');
      el.id = 'auara-hud';
      el.style.cssText = 'position:fixed;top:8px;left:8px;z-index:2147483647;max-width:96vw;padding:8px 10px;border-radius:6px;background:rgba(0,0,0,.82);color:#fff;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none';
      var mount = function () { (document.body || document.documentElement).appendChild(el); };
      if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
      var rec = [], last = performance.now(), impact = null, lastPaint = 0, hasImpactVar = false;
      function pick(a, b) { var r = []; for (var i = 0; i < rec.length; i++) if (rec[i][0] >= a && rec[i][0] < b) r.push(rec[i][1]); return r; }
      function st(a) {
        if (!a.length) return null;
        var s = a.slice().sort(function (x, y) { return x - y; }), sum = 0, o = 0;
        for (var i = 0; i < a.length; i++) { sum += a[i]; if (a[i] > 33.4) o++; }
        return { n: a.length, avg: sum / a.length, p95: s[Math.floor(0.95 * (s.length - 1))], max: s[s.length - 1], over: o };
      }
      function fmt(x) { return x ? ('media ' + x.avg.toFixed(1) + ' ms (' + (1000 / x.avg).toFixed(0) + ' fps) · p95 ' + x.p95.toFixed(0) + ' · máx ' + x.max.toFixed(0) + ' · >33 ms: ' + x.over + '/' + x.n) : '— sin datos'; }
      function paint(now) {
        var sec = st(pick(now - 1000, now + 1));
        var real = window.__AUARA_REAL_DPR || window.devicePixelRatio || 1, used = Math.min(window.devicePixelRatio || 1, 2);
        var out = label + '\nVentana ' + window.innerWidth + '×' + window.innerHeight + ' px · DPR de tu pantalla ' + real
                + ' · se dibuja a ' + used + '× (' + Math.round(window.innerWidth * used) + '×' + Math.round(window.innerHeight * used) + ' px = '
                + (window.innerWidth * used * window.innerHeight * used / 1e6).toFixed(1) + ' Mpx)'
                + '\nÚltimo segundo: ' + (sec ? (1000 / sec.avg).toFixed(0) + ' fps · peor fotograma ' + sec.max.toFixed(0) + ' ms' : '—');
        if (hasImpactVar) {
          if (impact === null) out += '\nEsperando el impacto de la gota…';
          else {
            out += '\nANTES   (−2 s → 0)    : ' + fmt(st(pick(impact - 2000, impact)));
            out += '\nIMPACTO (0 → 1,5 s)   : ' + fmt(st(pick(impact, impact + 1500)));
            out += '\nDESPUÉS (1,5 → 4,5 s) : ' + fmt(st(pick(impact + 1500, impact + 4500)));
            if (now - impact < 4500) out += '\n(midiendo… ' + ((now - impact) / 1000).toFixed(1) + ' s)';
          }
        }
        el.textContent = out;
      }
      function loop(now) {
        rec.push([now, now - last]); last = now;
        if (rec.length > 3000) rec.shift();
        var t; try { t = distortionWaves.length; } catch (e) { t = undefined; }
        if (typeof t === 'number') { hasImpactVar = true; if (impact === null && t > 0) impact = now; }
        if (now - lastPaint > 250) { lastPaint = now; paint(now); }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(function (n) { last = n; requestAnimationFrame(loop); });
    }

    // Código que se antepone a la página según las pruebas activadas
    function testSetup(name) {
      var pre = tests.perf ? 'window.__AUARA_REAL_DPR=window.devicePixelRatio;' : '', post = [];
      if (tests.dpr1) pre += 'Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}});';
      if (tests.norings) post.push('try{DistortionWave.prototype.drawFranjasBlancas=function(){}}catch(e){}');
      if (tests.norays) post.push('try{window.updateSunbeamsLayer=function(){}}catch(e){}', 'try{window.renderSkySunbeams=function(){}}catch(e){}');
      if (post.length) pre += 'setTimeout(function(){' + post.join('') + '},0);';
      if (tests.perf) {
        var label = (name === 'intro' ? (introBuild === 'before' ? 'INTRO REFERENCIA (tu original)' : 'INTRO NUEVO') : 'CASO')
                  + (tests.dpr1 ? ' · DPR 1' : '') + (tests.norings ? ' · sin anillos' : '') + (tests.norays ? ' · sin rayos' : '');
        pre += 'window.__AUARA_PERF_LABEL=' + JSON.stringify(label) + ';(' + auaraHud.toString() + ')();';
      }
      return pre ? '<script>' + pre + '<\/script>' : '';
    }

    function removeLater(frame) { setTimeout(function () { frame.remove(); }, 500); }

    function load(name, opts) {
      opts = opts || {};
      currentName = name;
      syncPageButtons();

      // Una carga anterior que aún no llegó a mostrarse se descarta
      if (pending && !pending._shown) { pending.remove(); }

      var html = applyMotion(name === 'intro' && introBuild === 'before' ? PAGES.introBefore : PAGES[name]), inject = '';
      // Al volver al intro desde el caso: sin animación de apertura (equivale a ?skipIntro=true)
      // Motion «System»/«Reduced»: se activa el interruptor para probar el camino que RESPETA el ajuste del sistema
      if (motion !== 'full') inject += '<script>window.AUARA_HONOR_REDUCED_MOTION = true;<\/script>';
      if (name === 'intro' && opts.skip) inject += '<script>window.__AUARA_SKIP = true;<\/script>';
      // Al llegar al caso desde el intro: entrada con el agua (equivale al referrer en un servidor real)
      if (name === 'study' && opts.from === 'intro') inject += '<script>window.__AUARA_FROM_INTRO = true;<\/script>';
      // Relevo de la fase de las olas entre páginas (en un servidor real viaja por sessionStorage)
      if (opts.handoff) inject += '<script>window.__AUARA_HANDOFF = ' + JSON.stringify(opts.handoff) + ';<\/script>';
      inject += testSetup(name);
      if (inject) html = html.replace('<head>', '<head>' + inject);

      var f = document.createElement('iframe');
      f.className = 'frame';
      f.title = TITLES[name];
      f.srcdoc = html;
      f._shown = false;
      f._show = function () {
        if (f._shown) return;
        f._shown = true;
        requestAnimationFrame(function () {
          f.style.opacity = 1;                       // el nuevo entra encima; el anterior sigue opaco debajo (sin huecos)
          var old = current;
          current = f; pending = null;
          if (old) removeLater(old);
        });
      };
      stage.appendChild(f);
      pending = f;

      f.addEventListener('load', function () {
        if (name === 'study') setTimeout(f._show, 2000);   // el caso avisa con "ready"; esto es solo respaldo
        else f._show();
      });
    }

    // Barra: elegir página (pulsar la activa la reinicia, útil para repetir la animación de apertura)
    for (var i = 0; i < pageBtns.length; i++) {
      pageBtns[i].addEventListener('click', function (e) { load(e.currentTarget.getAttribute('data-page'), {}); });
    }

    // Barra: elegir el ajuste de movimiento (recarga la página actual para aplicarlo)
    for (var m = 0; m < motionBtns.length; m++) {
      motionBtns[m].addEventListener('click', function (e) {
        var btn = e.currentTarget;
        motion = btn.getAttribute('data-motion');
        for (var k = 0; k < motionBtns.length; k++) motionBtns[k].setAttribute('aria-pressed', String(motionBtns[k] === btn));
        load(currentName, {});
      });
    }

    // Barra: versión del intro (nueva / antigua) y pruebas de medición (recargan la página actual)
    var buildBtns = document.querySelectorAll('[data-introbuild]');
    var testBtns = document.querySelectorAll('[data-test]');
    for (var q = 0; q < buildBtns.length; q++) {
      buildBtns[q].addEventListener('click', function (e) {
        var btn = e.currentTarget;
        introBuild = btn.getAttribute('data-introbuild');
        for (var k = 0; k < buildBtns.length; k++) buildBtns[k].setAttribute('aria-pressed', String(buildBtns[k] === btn));
        load(currentName, {});
      });
    }
    for (var r = 0; r < testBtns.length; r++) {
      testBtns[r].addEventListener('click', function (e) {
        var btn = e.currentTarget, key = btn.getAttribute('data-test');
        tests[key] = !tests[key];
        btn.setAttribute('aria-pressed', String(tests[key]));
        load(currentName, {});
      });
    }


    // Barra: dispositivo. Ancho (las media queries de la página reaccionan en directo) y, con "Real height",
    // también la altura real del dispositivo: el marco mide exactamente eso y se escala para caber en el panel.
    var deviceW = null, deviceH = null, realHeight = true;
    var btnReal = document.getElementById('btn-real'), infoEl = document.getElementById('device-info');

    function applyDevice() {
      var real = !!(realHeight && deviceW && deviceH), k = 1;
      stage.style.setProperty('--vw', deviceW ? deviceW + 'px' : '100%');
      if (real) {
        // el panel, menos un respiro arriba y abajo (24 px) y a los lados (24 px)
        k = Math.min(1, (stage.clientHeight - 24) / deviceH, (stage.clientWidth - 24) / deviceW);
        k = Math.max(0.2, k);
        stage.style.setProperty('--vh', deviceH + 'px');
        stage.style.setProperty('--k', k.toFixed(4));
      } else {
        stage.style.removeProperty('--vh');
        stage.style.setProperty('--k', '1');
      }
      if (stage.classList) { stage.classList.toggle('is-device', !!deviceW); stage.classList.toggle('real', real); }
      infoEl.textContent = real ? (deviceW + ' × ' + deviceH + ' · ' + Math.round(k * 100) + ' %')
                          : (deviceW ? deviceW + ' px de ancho' : '');
    }

    for (var j = 0; j < sizeBtns.length; j++) {
      sizeBtns[j].addEventListener('click', function (e) {
        var btn = e.currentTarget, w = btn.getAttribute('data-width');
        deviceW = w === 'fit' ? null : parseInt(w, 10);
        deviceH = w === 'fit' ? null : parseInt(btn.getAttribute('data-height'), 10);
        for (var k = 0; k < sizeBtns.length; k++) sizeBtns[k].setAttribute('aria-pressed', String(sizeBtns[k] === btn));
        applyDevice();
      });
    }
    btnReal.addEventListener('click', function () {
      realHeight = !realHeight;
      btnReal.setAttribute('aria-pressed', String(realHeight));
      applyDevice();
    });
    window.addEventListener('resize', applyDevice);

    // Navegación entre páginas (Start / volver) simulada con mensajes
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || !d.auara) return;
      if (d.auara === 'ready') {                      // la página nueva ya dibujó su primer fotograma
        if (pending && e.source === pending.contentWindow) pending._show();
        return;
      }
      if (d.auara !== 'go') return;
      if (!current || e.source !== current.contentWindow) return;   // solo la página visible navega
      if (d.to === 'study' || d.to === 'intro') {
        load(d.to, { skip: !!d.skip, from: d.to === 'study' ? 'intro' : 'study', handoff: d.handoff });
      }
    });

    load('intro', {});
  })();
  </script>
