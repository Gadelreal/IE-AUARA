<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>AUARA Case — review on devices</title>
  <style>
    :root { --stage: #D7DEDC; --bar: #1D1D1D; --bar-text: #FFFFFF; --bar-muted: #B8B8B8; --bar-line: #6B6B6B; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #2A2F2E; } }
    :root[data-theme="dark"] { --stage: #2A2F2E; }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--stage); }

    .bar {
      position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 10;
      display: flex; align-items: center; gap: 12px; padding: 0 12px;
      background: var(--bar); color: var(--bar-text);
      font: 500 13px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      white-space: nowrap; overflow-x: auto;
    }
    .group { display: flex; gap: 4px; }
    .sep { width: 1px; height: 18px; background: #4A4A4A; flex: none; }
    .bar button {
      font: inherit; color: var(--bar-text); background: transparent;
      border: 1px solid var(--bar-line); border-radius: 6px;
      padding: 7px 10px; min-height: 28px; cursor: pointer;
    }
    .bar button:hover { border-color: #fff; }
    .bar button[aria-pressed="true"] { background: #fff; color: #1D1D1D; border-color: #fff; }
    .bar button:focus-visible { outline: 2px solid #5FE0E0; outline-offset: 2px; }
    .label { color: var(--bar-muted); font-weight: 400; }
    .build { margin-left: auto; color: var(--bar-muted); font-weight: 400; padding-left: 12px; max-width: 50vw; overflow: hidden; text-overflow: ellipsis; cursor: default; }
    .advanced { display: flex; align-items: center; gap: 12px; }
    .advanced[hidden] { display: none; }

    #stage { position: fixed; top: 40px; left: 0; right: 0; bottom: 0; background: var(--stage); }
    .frame {
      position: absolute; top: 0; left: 50%;
      width: var(--vw, 100%); max-width: 100%;
      height: var(--vh, 100%);    /* un iframe no se estira con top/bottom: altura explícita */
      translate: -50% 0;
      scale: var(--k, 1); transform-origin: 50% 0;   /* en modo "altura real" se reduce para que la pantalla quepa entera */
      border: 0; background: #EEF4F3;
      opacity: 0; transition: opacity 0.3s ease;
    }
    #stage.is-device .frame { box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 8px 30px rgba(0,0,0,.2); }
    /* Altura real: el marco mide EXACTAMENTE lo que el dispositivo (la página ve ese viewport), escalado solo en pantalla */
    #stage.real .frame { max-width: none; top: 12px; border-radius: 12px; }
    #device-info { color: var(--bar-muted); font-weight: 400; }
    @media (prefers-reduced-motion: reduce) { .frame { transition: none; } }
  </style>
</head>
<body>
  <div class="bar" role="toolbar" aria-label="Preview controls">
    <span class="label" id="lbl-page">Page</span>
    <div class="group" role="group" aria-labelledby="lbl-page">
      <button type="button" data-page="intro" aria-pressed="true">Intro</button>
      <button type="button" data-page="study" aria-pressed="false">Case</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <span class="label" id="lbl-size">Device</span>
    <div class="group" role="group" aria-labelledby="lbl-size">
      <button type="button" data-width="390" data-height="844" aria-pressed="false" title="Phone · 390 × 844 px">Phone 390</button>
      <button type="button" data-width="768" data-height="1024" aria-pressed="false" title="Tablet · 768 × 1024 px">Tablet 768</button>
      <button type="button" data-width="1280" data-height="720" aria-pressed="false" title="Desktop · 1280 × 720 px">Desktop 1280</button>
      <button type="button" data-width="fit" aria-pressed="true" title="Fills the whole panel">Fit</button>
    </div>
    <button type="button" id="btn-real" aria-pressed="true" title="Use each device's real screen height. The screen is scaled down to fit this panel; the page still sees the real size.">Real height</button>
    <span class="label" id="device-info" aria-live="polite"></span>
    <span class="build" id="build"></span>
  </div>

  <div id="stage"></div>

=============== */\n    :root {\n      /* Colores oficiales */\n      --bg-lienzo: #EEF4F3;        /* Fondo fijo - Blanco frío */\n      --fondo-cielo: #EEF4F3;\n      --blanco: #FFFFFF;\n      --borde: #DDE8E6;            /* Líneas de estructura */\n      --primario: #00AFAF;         /* Turquesa AUARA plano */\n      --acento: #007E7E;           /* Turquesa profundo plano */\n      --texto-turquesa: #006666;   /* Glifos, eyebrows y metadatos */\n      --texto-negro: #111111;      /* Negro HR */\n      --texto-titulo: #1D1D1D;     /* Titular del hero (Figma) */\n      --texto-cuerpo: #455455;     /* Gris carbón de lectura (Figma) */\n\n      /* Tipografías oficiales */\n      --font-display: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n      --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n      -webkit-font-smoothing: antialiased;\n    }\n\n    html {\n      height: 100%;\n    }\n\n    /* Sin overflow:hidden: si el contenido no cabe (zoom 200 %, texto\n       agrandado, móvil apaisado) la página puede hacer scroll vertical\n       en lugar de recortar el texto (WCAG 1.4.4 / 1.4.10). */\n    body {\n      min-height: 100%;\n      overflow-x: hidden;\n      overflow-y: auto;\n      background-color: var(--bg-lienzo);\n      font-family: var(--font-display);\n      color: var(--texto-negro);\n    }\n\n    #app {\n      position: relative;\n      width: 100%;\n      min-height: 100vh;\n      min-height: 100dvh;       /* JS lo amplía si el módulo hero no cabe */\n      display: block;           /* hero-container is absolute; no more flex layout */\n      cursor: default;\n    }\n\n    /* Texto solo para tecnologías de apoyo */\n    .sr-only {\n      position: absolute;\n      width: 1px;\n      height: 1px;\n      padding: 0;\n      margin: -1px;\n      overflow: hidden;\n      clip: rect(0, 0, 0, 0);\n      white-space: nowrap;\n      border: 0;\n    }\n\n    /* Lienzo para la animación matemática y física flat.\n       Fijo al viewport: queda de fondo aunque la página haga scroll. */\n    canvas {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 100%;\n      z-index: 1;\n      pointer-events: none;\n      user-select: none;\n    }\n\n    /* ========================================================\n       MÓDULO HERO: Título + subtítulo + botón = una sola entidad\n       Posicionado absolutamente por JS; su BASE queda justo\n       en el horizonte del agua (donde cae la gota).\n       ======================================================== */\n    .hero-container {\n      position: absolute;\n      left: 50%;\n      transform: translateX(-50%);\n      z-index: 10;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      text-align: center;\n      max-width: 860px;\n      width: 100%;\n      padding: 0 28px;\n      pointer-events: auto;\n      user-select: text;\n      /* top is set dynamically by JS */\n    }\n\n    /* 0. Número de sección «01» (Group 92 del diseño): 121 × 32 px a 1440 px, con su línea base.\n       Va pegado al titular: 3 px de aire entre la línea y la caja del título (Figma: 3,4 px). */\n    .hero-number {\n      display: block;\n      width: clamp(84px, 8.4vw, 121px);\n      height: auto;\n      margin: 0 auto 3px;\n      opacity: 0;\n      transform: translateY(28px);\n      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);\n    }\n\n    /* Tamaño óptico: Figma dibuja Bricolage Grotesque con el eje «opsz» en su mínimo (14), no en el\n       automático del navegador (= tamaño en px). Con opsz 14 y 48 px el título mide 493 px, como en el\n       diseño (494); con el automático saldría un 4 % más estrecho y con otras formas. */\n    .hero-title,\n    .hero-subtitle { font-variation-settings: 'opsz' 14; }\n\n    /* 1. Titular · Bricolage Grotesque Medium 500 · 48 px · #1D1D1D · altura de línea 1,2 (58 px) · interletraje 0\n       (a partir de 923 px de ancho; por debajo se escala hasta 30 px) */\n    .hero-title {\n      font-family: var(--font-display);\n      font-weight: 500;\n      font-size: clamp(30px, 5.2vw, 48px);\n      line-height: 1.2;\n      letter-spacing: 0;\n      color: var(--texto-titulo);\n      margin-bottom: 0;\n      opacity: 0;\n      transform: translateY(28px);\n      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);\n      user-select: text;\n      cursor: text;\n    }\n\n    /* 2. Entradilla · Bricolage Grotesque Regular 400 · 24 px · #455455 · interletraje −4 % · línea 1,2\n       Salto de línea manual tras «large,» (como en el diseño); en pantallas estrechas se desactiva.\n       72 px hasta el botón (a partir de 1440 px de ancho; por debajo se reduce). */\n    .hero-subtitle {\n      font-family: var(--font-display);\n      font-weight: 400;\n      font-size: clamp(17px, 2.6vw, 24px);\n      line-height: 1.2;\n      letter-spacing: -0.04em;\n      color: var(--texto-cuerpo);\n      max-width: 760px;\n      margin-bottom: clamp(28px, 5vw, 72px);\n      opacity: 0;\n      transform: translateY(22px);\n      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.18s, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.18s;\n      user-select: text;\n      cursor: text;\n    }\n    @media (max-width: 900px) {\n      .br-wide { display: none; }\n    }\n\n    /* Logo IE · arriba a la izquierda (Figma: x 43, y 28, 58 × 49 px a 1440 px de ancho) */\n    .brand-bar {\n      position: absolute;\n      top: 0;\n      left: 0;\n      z-index: 10;\n      padding: clamp(14px, 1.93vw, 28px) 0 0 clamp(16px, 3vw, 43px);\n    }\n    .brand {\n      display: block;\n      width: clamp(40px, 4vw, 58px);\n      line-height: 0;\n      border-radius: 4px;\n    }\n    .brand svg { display: block; width: 100%; height: auto; }\n    .brand:focus-visible { outline: 3px solid var(--acento); outline-offset: 4px; }\n\n    /* Ondas tipográficas interactivas sobre el texto en el clic de Start */\n    .wave-word {\n      display: inline-block;\n      white-space: nowrap;\n    }\n\n    .wave-char {\n      display: inline-block;\n    }\n    /* will-change solo mientras la letra se anima (al pulsar Start):\n       antes eran ~150 capas de GPU permanentes */\n    .wave-char.distorting {\n      will-change: transform, color;\n    }\n\n    /* Ondulación líquida para el Título en Bricolage Grotesque */\n    .hero-title .wave-char.distorting {\n      animation: titleFluidWave 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;\n      animation-delay: var(--wave-delay, 0s);\n    }\n\n    @keyframes titleFluidWave {\n      0% {\n        transform: translateY(0);\n        color: var(--texto-titulo);\n      }\n      22% {\n        transform: translateY(-7px);\n        color: var(--primario); /* #00AFAF */\n      }\n      44% {\n        transform: translateY(3.5px);\n        color: var(--acento); /* #007E7E */\n      }\n      66% {\n        transform: translateY(-1.5px);\n        color: var(--texto-turquesa); /* #006666 */\n      }\n      85% {\n        transform: translateY(0.5px);\n        color: var(--texto-turquesa);\n      }\n      100% {\n        transform: translateY(0);\n        color: var(--texto-titulo);\n      }\n    }\n\n    /* Ondulación líquida para la Entradilla / Subtítulo */\n    .hero-subtitle .wave-char.distorting {\n      animation: subtitleFluidWave 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;\n      animation-delay: var(--wave-delay, 0s);\n    }\n\n    @keyframes subtitleFluidWave {\n      0% {\n        transform: translateY(0);\n        color: var(--texto-cuerpo);\n      }\n      22% {\n        transform: translateY(-3.8px);\n        color: var(--primario); /* #00AFAF */\n      }\n      44% {\n        transform: translateY(1.8px);\n        color: var(--acento); /* #007E7E */\n      }\n      66% {\n        transform: translateY(-0.8px);\n        color: var(--texto-turquesa); /* #006666 */\n      }\n      85% {\n        transform: translateY(0.3px);\n        color: var(--texto-cuerpo);\n      }\n      100% {\n        transform: translateY(0);\n        color: var(--texto-cuerpo);\n      }\n    }\n\n    /* ========================================================\n       APARICIÓN DEL TEXTO AL IMPACTO DE LA GOTA\n       Sin animación por letra: al añadir .visible, título y subtítulo\n       suben desde abajo y pasan de 0 a 100 % de opacidad (reglas\n       .hero-title / .hero-subtitle / .btn-start de arriba).\n       ======================================================== */\n\n    /* ========================================================\n       SALIDA HACIA EL CASO: el agua sube y llena la pantalla.\n       Título y subtítulo se desvanecen enseguida (.text-leaving);\n       el botón y los controles, cuando empieza a subir el agua.\n       ======================================================== */\n    #app.leaving .bottom-water-bar,\n    #app.leaving .brand-bar,\n    #app.leaving .btn-start {\n      opacity: 0 !important;\n      transition: opacity 0.4s ease !important;\n      pointer-events: none;\n    }\n\n    /* Al pulsar Start el texto se desvanece enseguida, antes de que suba el agua */\n    #app.text-leaving .hero-subtitle,\n    #app.text-leaving.fade-title .hero-number,\n    #app.text-leaving.fade-title .hero-title {\n      opacity: 0 !important;\n      transition: opacity 0.6s ease !important;\n    }\n\n    /* ========================================================\n       TRANSICIÓN CONTINUA ENTRE PÁGINAS (View Transitions API)\n       El titular y el subtítulo comparten nombre con los de la\n       página del caso: el navegador los desplaza y escala hasta\n       su nueva posición. Navegadores sin soporte usan el velo.\n       ======================================================== */\n    @view-transition { navigation: auto; }\n\n    .hero-title    { view-transition-name: case-title; }\n    .hero-subtitle { view-transition-name: case-subtitle; }\n\n    ::view-transition-group(case-title),\n    ::view-transition-group(case-subtitle) {\n      animation-duration: 0.9s;\n      animation-timing-function: cubic-bezier(0.65, 0, 0.25, 1);\n    }\n    /* El subtítulo cambia de alineación (centrado ↔ izquierda): la versión\n       vieja se retira pronto para que no se vean dos textos superpuestos */\n    ::view-transition-old(case-subtitle) {\n      animation: vtFadeOut 0.3s ease both;\n    }\n    /* Ambas páginas empiezan/terminan con el agua cubriendo la pantalla: fundido simultáneo y corto, sin hueco */\n    ::view-transition-old(root) {\n      animation: vtFadeOut 0.5s ease both;\n    }\n    ::view-transition-new(root) {\n      animation: vtFadeIn 0.5s ease both;\n    }\n    @keyframes vtFadeOut { to { opacity: 0; } }\n    @keyframes vtFadeIn { from { opacity: 0; } }\n\n    /* Pausa global: congela también las animaciones CSS */\n    #app.is-paused .wave-char.distorting,\n    #app.is-paused .btn-start.launching {\n      animation-play-state: paused;\n    }\n\n    /* Pulsación luminosa del botón Start al hacer clic */\n    .btn-start.launching {\n      pointer-events: none;\n      animation: btnStartPulse 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;\n    }\n\n    @keyframes btnStartPulse {\n      0% { transform: scale(1); }\n      25% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.9); }\n      60% { transform: scale(1.05); box-shadow: 0 0 0 35px rgba(255, 255, 255, 0); }\n      100% { transform: scale(1); }\n    }\n\n    #page-transition-veil {\n      position: fixed;\n      inset: 0;\n      background-color: var(--bg-lienzo);\n      opacity: 0;\n      pointer-events: none;\n      z-index: 9999;\n      transition: opacity 0.85s cubic-bezier(0.33, 1, 0.68, 1);\n    }\n\n    #page-transition-veil.active {\n      opacity: 1;\n      pointer-events: auto;\n    }\n\n    /* 3. Call to Action: Start (Bricolage Grotesque 700 • flat AUARA) */\n    /* Es un enlace (\u003ca>) con aspecto de botón: navega sin JS y permite\n       abrir el caso en otra pestaña.\n       Fondo #007E7E: contraste 4,9:1 con el texto blanco (AA).\n       El turquesa #00AFAF solo daba 2,7:1. */\n    .btn-start {\n      display: inline-block;\n      font-family: var(--font-display);\n      font-size: 16px;\n      font-weight: 700;\n      letter-spacing: -0.01em;\n      line-height: 1.2;\n      color: var(--blanco);\n      background-color: var(--acento);\n      padding: 14px 44px;\n      border: none;\n      border-radius: 9999px;\n      cursor: pointer;\n      box-shadow: none;\n      text-decoration: none;\n      opacity: 0;\n      translate: 0 18px;\n      transition: opacity 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.36s,\n                  translate 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.36s,\n                  background-color 0.2s ease;\n      user-select: none;\n    }\n\n    .btn-start:hover {\n      background-color: var(--texto-turquesa); /* #006666 · 6,8:1 */\n    }\n\n    .btn-start:active {\n      background-color: var(--texto-turquesa);\n      transform: scale(0.97);\n    }\n\n    /* Foco visible para teclado (WCAG 2.4.7). #007E7E sobre el lienzo ≥ 3:1 */\n    .btn-start:focus-visible {\n      outline: 3px solid var(--acento);\n      outline-offset: 4px;\n    }\n\n    /* Mientras el módulo está oculto, el botón no se puede enfocar ni pulsar */\n    .hero-container:not(.visible) .btn-start {\n      visibility: hidden;\n    }\n\n    /* Estado revelado: todo el módulo hero aparece */\n    .hero-container.visible .hero-number,\n    .hero-container.visible .hero-title,\n    .hero-container.visible .hero-subtitle {\n      opacity: 1;\n      transform: translateY(0);\n    }\n    .hero-container.visible .btn-start {\n      opacity: 1;\n      translate: 0 0;\n    }\n\n    /* ========================================================\n       BOTÓN DE ACCESIBILIDAD CENTRADO EN LA FRANJA INFERIOR\n       ======================================================== */\n    .bottom-water-bar {\n      position: absolute;\n      bottom: 100px; /* 100px de separación exacta del borde inferior */\n      left: 0;\n      width: 100%;\n      height: auto;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 12px;\n      flex-wrap: wrap;\n      pointer-events: none;\n      z-index: 20;\n    }\n\n    .btn-pause-accessibility {\n      pointer-events: auto;\n      background: rgba(255, 255, 255, 0.88);\n      border: 1px solid var(--borde);\n      border-radius: 9999px;\n      padding: 9px 20px;\n      font-family: var(--font-mono);\n      font-size: 11px;\n      font-weight: 500;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n      color: var(--texto-turquesa);\n      cursor: pointer;\n      display: inline-flex;\n      align-items: center;\n      gap: 9px;\n      backdrop-filter: blur(8px);\n      box-shadow: 0 2px 8px rgba(0, 102, 102, 0.08);\n      transition: all 0.2s ease;\n      user-select: none;\n    }\n\n    .btn-pause-accessibility[hidden] {\n      display: none;\n    }\n\n    .btn-pause-accessibility.is-paused {\n      color: var(--texto-negro);\n      border-color: var(--primario);\n    }\n\n    .btn-pause-accessibility:hover {\n      background: var(--blanco);\n      border-color: var(--primario);\n      color: var(--texto-negro);\n      box-shadow: 0 4px 14px rgba(0, 102, 102, 0.16);\n    }\n\n    .btn-pause-accessibility:focus-visible {\n      outline: 2px solid var(--primario);\n      outline-offset: 3px;\n    }\n\n    .pause-svg {\n      width: 11px;\n      height: 11px;\n      display: block;\n      color: currentColor;\n    }\n\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\n  \u003cdiv id=\"app\">\n    \u003c!-- El cielo permanece liso y limpio en #EEF4F3; el agua y sus ondas se dibujan en la zona inferior.\n         Decorativo: oculto a tecnologías de apoyo. -->\n    \u003ccanvas id=\"stage\" aria-hidden=\"true\">\u003c/canvas>\n\n    \u003c!-- Controles de movimiento. Van primero en el DOM para que quien los\n         necesite los encuentre al primer Tab, aunque visualmente estén abajo. -->\n    \u003cdiv class=\"bottom-water-bar\" role=\"group\" aria-label=\"Animation controls\">\n      \u003cbutton type=\"button\" class=\"btn-pause-accessibility\" id=\"btn-pause\">\n        \u003csvg class=\"pause-svg\" id=\"pause-icon\" viewBox=\"0 0 12 12\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\">\n          \u003crect x=\"2\" y=\"1.5\" width=\"2.5\" height=\"9\" rx=\"0.8\"/>\n          \u003crect x=\"7.5\" y=\"1.5\" width=\"2.5\" height=\"9\" rx=\"0.8\"/>\n        \u003c/svg>\n        \u003cspan id=\"pause-label\">Pause animation\u003c/span>\n      \u003c/button>\n    \u003c/div>\n\n    \u003c!-- Módulo hero: título + subtítulo + botón como una sola entidad, anclada al horizonte del agua por JS -->\n    \u003c!-- Logo IE: arriba a la izquierda, como en el diseño. Mismo enlace y nombre accesible que en la página del caso. -->\n    \u003cheader class=\"brand-bar\">\n      \u003ca class=\"brand\" href=\"https://www.ie.edu/\" target=\"_blank\" rel=\"noopener\" aria-label=\"IE University — home\">\n        \u003csvg viewBox=\"0 0 58 49\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\">\n\u003cg opacity=\"0.9\">\n\u003cpath d=\"M22.714 11.1151C16.2641 11.1151 11.0361 16.3535 11.0361 22.8164V22.9695C11.0361 29.8325 16.5813 35.3889 23.4305 35.3889C27.5424 35.3889 31.1726 33.3876 33.4283 30.3034L28.6233 26.7365C27.6482 28.573 25.7214 29.8325 23.501 29.8325C20.7754 29.8325 18.4963 27.949 17.8736 25.418H34.0862C34.0979 25.3946 34.098 25.3828 34.1097 25.3592C34.1331 25.2414 34.1684 25.1237 34.1802 25.0059C34.3094 24.2996 34.3799 23.5581 34.3799 22.8164C34.3916 16.3535 29.1637 11.1151 22.714 11.1151ZM18.4258 20.1559C18.978 18.2018 20.7637 16.7656 22.8901 16.7656C25.0165 16.7656 26.8023 18.2018 27.3545 20.1559H18.4258Z\" fill=\"#111111\"/>\n\u003cpath d=\"M8.68979 11.1151H0.767381V35.3889H8.68979V11.1151Z\" fill=\"#111111\"/>\n\u003cpath d=\"M4.73976 9.4941C7.35748 9.4941 9.47951 7.3688 9.47951 4.74705C9.47951 2.12529 7.35748 0 4.73976 0C2.12203 0 0 2.12529 0 4.74705C0 7.3688 2.12203 9.4941 4.73976 9.4941Z\" fill=\"#111111\"/>\n\u003cpath d=\"M0.32603 46.0331C0.32603 47.6263 1.47659 48.7085 3.19741 48.7085C4.90819 48.7085 6.0586 47.6263 6.0586 46.0331V41.4741H4.76802V46.0231C4.76802 46.985 4.1378 47.5261 3.18737 47.5261C2.23694 47.5261 1.61661 46.985 1.61661 46.0331V41.4741H0.32603V46.0331Z\" fill=\"#111111\"/>\n\u003cpath d=\"M7.76337 48.5882H9.05395V44.4901C9.05395 44.0693 8.98394 43.388 8.98394 43.388H9.00387C9.00387 43.388 9.32409 44.0792 9.59423 44.4901L12.2854 48.5882H13.5659V41.4741H12.2854V45.5823C12.2854 46.0031 12.3554 46.6844 12.3554 46.6844H12.3355C12.3355 46.6844 12.0153 45.993 11.7451 45.5823L9.05395 41.4741H7.76337V48.5882Z\" fill=\"#111111\"/>\n\u003cpath d=\"M15.3645 48.5882H16.6551V41.4741H15.3645V48.5882Z\" fill=\"#111111\"/>\n\u003cpath d=\"M20.1325 48.5882H21.4132L24.0042 41.4741H22.6237L21.053 46.1133C20.9129 46.5241 20.7929 47.1554 20.7828 47.1554H20.7629C20.7528 47.1554 20.6328 46.5241 20.4927 46.1133L18.932 41.4741H17.5415L20.1325 48.5882Z\" fill=\"#111111\"/>\n\u003cpath d=\"M24.8903 48.5882H29.3021V47.476H26.1809V45.5621H28.5719V44.45H26.1809V42.5864H29.1422V41.4741H24.8903V48.5882Z\" fill=\"#111111\"/>\n\u003cpath d=\"M30.6449 48.5882H31.9354V45.933H33.1759L34.5866 48.5882H36.0272L34.5665 45.933C34.4265 45.6824 34.3265 45.5823 34.3265 45.5823V45.5621C35.0768 45.2616 35.527 44.47 35.527 43.6184C35.527 42.6764 35.0768 41.9951 34.3665 41.6745C34.0564 41.5342 33.7062 41.4741 32.9358 41.4741H30.6449V48.5882ZM31.9354 44.8107V42.5864H32.9158C33.9262 42.5864 34.2165 43.0072 34.2165 43.6885C34.2165 44.3999 33.7862 44.8107 33.0959 44.8107H31.9354Z\" fill=\"#111111\"/>\n\u003cpath d=\"M36.6895 47.7365C36.6895 47.7365 37.56 48.7085 39.1407 48.7085C40.6213 48.7085 41.4816 47.7566 41.4816 46.6244C41.4816 44.3497 38.1401 44.6604 38.1401 43.3979C38.1401 42.897 38.6104 42.5463 39.2107 42.5463C40.1011 42.5463 40.7814 43.1674 40.7814 43.1674L41.3416 42.1153C41.3416 42.1153 40.6213 41.3538 39.2207 41.3538C37.8601 41.3538 36.8397 42.2356 36.8397 43.418C36.8397 45.6022 40.1911 45.3818 40.1911 46.6544C40.1911 47.2355 39.7009 47.5161 39.1606 47.5161C38.1602 47.5161 37.3898 46.7646 37.3898 46.7646L36.6895 47.7365Z\" fill=\"#111111\"/>\n\u003cpath d=\"M42.7694 48.5882H44.06V41.4741H42.7694V48.5882Z\" fill=\"#111111\"/>\n\u003cpath d=\"M47.3274 48.5882H48.618V42.5864H50.9491V41.4741H44.9963V42.5864H47.3274V48.5882Z\" fill=\"#111111\"/>\n\u003cpath d=\"M53.6586 48.5882H54.9492V45.6123L57.3103 41.4741H55.8496L54.7491 43.5683C54.519 44.0091 54.3188 44.5202 54.3188 44.5202H54.2989C54.2888 44.5302 54.0988 44.0091 53.8687 43.5683L52.7581 41.4741H51.2975L53.6586 45.6123V48.5882Z\" fill=\"#111111\"/>\n\u003c/g>\n        \u003c/svg>\n      \u003c/a>\n    \u003c/header>\n\n    \u003cmain class=\"hero-container\" id=\"hero-container\">\n      \u003csvg class=\"hero-number\" viewBox=\"0 0 121 32\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\">\n\u003cline x1=\"4.37114e-08\" y1=\"31.1699\" x2=\"120.745\" y2=\"31.1699\" stroke=\"#1B1B1B\"/>\n\u003cpath d=\"M48.857 0C53.4832 8.33335e-05 57.4446 1.30109 60.7408 3.90332C64.0371 6.44782 66.5528 9.97567 68.2877 14.4863C70.0805 18.9972 70.9771 24.2028 70.9771 30.1016C70.9771 30.6296 70.9686 31.1524 70.9527 31.6699H64.5182C64.5446 30.9878 64.5582 30.2915 64.5582 29.5811C64.5582 24.6655 63.8922 20.4437 62.5621 16.916C61.2898 13.3305 59.4683 10.5832 57.0973 8.6748C54.7263 6.70865 51.9507 5.72564 48.7701 5.72559C45.9364 5.72559 43.3045 6.59319 40.8756 8.32812C38.4469 10.0631 36.4807 12.6942 34.9771 16.2217C33.5314 19.7493 32.8082 24.2601 32.8082 29.7539C32.8082 30.4048 32.8202 31.0435 32.8414 31.6699H26.4996C26.4846 31.1526 26.4762 30.6298 26.4762 30.1016C26.4762 23.8558 27.401 18.5057 29.2516 14.0527C31.16 9.54195 33.7919 6.07245 37.1461 3.64355C40.5003 1.2147 44.4041 0 48.857 0ZM94.2691 31.6699H87.7633V12.9248H79.609V7.2002C82.1534 7.20019 84.293 6.824 86.0279 6.07227C87.8206 5.26266 88.9771 3.6145 89.4977 1.12793H94.2691V31.6699Z\" fill=\"#1D1D1D\"/>\n      \u003c/svg>\n      \u003ch1 class=\"hero-title\">Welcome to the Case\u003c/h1>\n      \u003cp class=\"hero-subtitle\">What happens when a social enterprise joins forces with a large,\u003cbr class=\"br-wide\"> commercial company to scale its impact?\u003c/p>\n      \u003ca class=\"btn-start\" id=\"btn-start\" href=\"auara-case-study.html\">Start\u003c/a>\n    \u003c/main>\n  \u003c/div>\n\n  \u003c!-- El velo debe existir antes de que se ejecute el script -->\n  \u003cdiv id=\"page-transition-veil\" aria-hidden=\"true\">\u003c/div>\n\n  \u003cscript>\n    /* INTERRUPTOR «REDUCIR MOVIMIENTO» (el mismo que en la página del caso)\n       false (actual): las animaciones se muestran siempre; true: se respeta el ajuste del sistema\n       (aquí solo afecta a la animación de llegada al volver desde el caso). */\n    if (window.AUARA_HONOR_REDUCED_MOTION === undefined) window.AUARA_HONOR_REDUCED_MOTION = false;\n    const canvas = document.getElementById('stage');\n    const ctx = canvas.getContext('2d');\n    const heroContainer = document.getElementById('hero-container');\n    const btnStart = document.getElementById('btn-start');\n    const btnPause = document.getElementById('btn-pause');\n    const pauseLabel = document.getElementById('pause-label');\n    const pauseIcon = document.getElementById('pause-icon');\n\n    const appEl = document.getElementById('app');\n    const controlsBar = document.querySelector('.bottom-water-bar');\n    const CASE_URL = btnStart.getAttribute('href');\n\n    // Relevo entre páginas: la fase de las olas viaja con el usuario para que el primer\n    // fotograma de la otra página sea el último de esta (misma sessionStorage de origen)\n    function goToCase() {\n      try {\n        sessionStorage.setItem('auara-water-handoff', JSON.stringify({ t: animTime, at: Date.now(), skip: isAnimationPaused }));\n      } catch (e) {}\n      window.parent.postMessage({ auara: 'go', to: 'study', handoff: { t: animTime, at: Date.now(), skip: isAnimationPaused } }, '*');\n    }\n    function readHandoff() {\n      try {\n        if (window.__AUARA_HANDOFF) return window.__AUARA_HANDOFF;     // inyectado por la previsualización\n        const raw = sessionStorage.getItem('auara-water-handoff');\n        if (raw) { sessionStorage.removeItem('auara-water-handoff'); return JSON.parse(raw); }\n      } catch (e) {}\n      return null;\n    }\n\n    let isAnimationPaused = false;\n\n\n    // Limpieza: una versión anterior guardaba la pausa entre visitas y eso\n    // hacía que la intro no volviera a reproducirse. Se borra esa clave.\n    try { localStorage.removeItem('auara-motion-paused'); } catch (e) {}\n\n    // Control del bucle y del tiempo\n    let rafId = null;        // id del frame pendiente: evita bucles duplicados\n    let animTime = 0;        // reloj propio de la animación en segundos (se congela en pausa)\n    let frameScale = 1;      // 1 = un frame a 60 fps; 0.5 = un frame a 120 fps\n    const MAX_DELTA = 0.05;  // evita saltos al volver de otra pestaña\n\n\n    // Subida del agua al pulsar Start\n    let waterRise = { active: false, t: 0, duration: 1.25, dir: 1, hold: 0 };   // dir: 1 sube · -1 baja (al volver del caso)\n\n    // Transición continua entre documentos: requiere soporte y un servidor (no file://)\n    const supportsCrossDocVT =\n      'onpagereveal' in window &&\n      window.CSS && CSS.supports && CSS.supports('view-transition-name: a') &&\n      location.protocol !== 'file:';\n\n    // Convierte un factor de suavizado \"por frame a 60 fps\" en uno independiente de los fps\n    function lerpFactor(base) {\n      return 1 - Math.pow(1 - base, frameScale);\n    }\n\n    let width = 0;\n    let height = 0;\n    let dpr = 1;\n\n    let staticSurfaceY = 0;\n    function updateSurfacePosition() {\n      // Horizonte de agua FIJO en el 58% de la pantalla.\n      // No depende de los elementos HTML → sin bucles circulares.\n      staticSurfaceY = height * 0.58;\n\n      // Anclar el MÓDULO hero (título+subtítulo+botón) de forma que\n      // la base inferior del módulo quede justo en el horizonte del agua.\n      // El botón (último elemento) queda así centrado en la línea de olas,\n      // igual que la gota del loop.\n      if (heroContainer) {\n        const heroH = heroContainer.offsetHeight || 200;\n        // sky breathing room on top = at least 10vh\n        const minTopPad = Math.max(height * 0.10, 60);\n        // base of module at surface\n        let heroTop = staticSurfaceY - heroH;\n        // clamp so module never goes above minTopPad\n        heroTop = Math.max(minTopPad, heroTop);\n        heroContainer.style.top = heroTop + 'px';\n\n        // Si el módulo no cabe sobre la barra de controles (zoom, texto grande,\n        // pantalla baja), se amplía #app para que la página haga scroll en vez\n        // de solapar o recortar el contenido.\n        const barH = controlsBar ? controlsBar.offsetHeight : 0;\n        const needed = heroTop + heroH + 24 + barH + 100;\n        appEl.style.minHeight = needed > height ? needed + 'px' : '';\n      }\n    }\n\n    function resize() {\n      // Limitado a 2x: en pantallas 3x el coste de píxeles se dispara sin mejora visible\n      dpr = Math.min(window.devicePixelRatio || 1, 2);\n      width = window.innerWidth;\n      height = window.innerHeight;\n      canvas.width = Math.round(width * dpr);\n      canvas.height = Math.round(height * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      updateSurfacePosition();\n      if (sunbeamsCanvas) buildSunbeamsLayer();         // recalcula la imagen de los rayos al nuevo tamaño\n      if (isAnimationPaused && typeof drawStillFrame === 'function') drawStillFrame();\n    }\n    window.addEventListener('resize', resize);\n    resize();\n\n    // Recolocar el módulo cuando cargan las fuentes o cambia su altura,\n    // en lugar de temporizadores a ciegas.\n    if (document.fonts && document.fonts.ready) {\n      document.fonts.ready.then(updateSurfacePosition);\n    }\n    if ('ResizeObserver' in window) {\n      new ResizeObserver(updateSurfacePosition).observe(heroContainer);\n    }\n\n    /* ========================================================\n       FASES NARRATIVAS Y CÁMARA\n       ======================================================== */\n    const STAGE_GRID_ALIGN   = 0; // Átomos de agua orbitan y guían la mirada hacia el punto donde nace la gota\n    const STAGE_CONDENSE     = 1; // Los átomos se pliegan hacia el núcleo y forman la gota flat con zoom in\n    const STAGE_FREE_FALL    = 2; // Desprendimiento y cámara siguiendo en picado\n    const STAGE_IMPACT_BURST = 3; // Gran impacto flat, ondas elípticas y rayos en el cauce\n    const STAGE_LOOP_FLOW    = 4; // Loop continuo armónico y sereno\n\n        let sunbeamIntroTimer = -1; // -1: inactivo (solo se activa al inicio del loop)\n    let currentStage = STAGE_GRID_ALIGN;\n    let stageTimer = 0;\n    let lastTimestamp = performance.now();\n\n    // Sistema de cámara suave\n    let camera = {\n      zoom: 0.82,\n      targetZoom: 1.55,\n      y: 0,\n      targetY: 0\n    };\n\n    // Colecciones de elementos flat\n    let inflowDots = [];\n    let distortionWaves = [];\n    let loopDrops = [];\n    let mainDrop = null;\n    let impactRevealTimer = null; // temporizador del revelado aplazado tras el impacto de la gota\n    let lastLoopSpawn = 0;\n    let departureWaves = [];\n\n    // Clase para las ondas blancas que parten del botón Start hacia el cielo y el texto\n    class DepartureWave {\n      constructor(originX, originY) {\n        this.originX = originX;\n        this.originY = originY;\n        this.radius = 0;\n        this.maxRadius = Math.max(width, height) * 2.2;\n        this.speed = 460; // px/s de avance fluido\n        this.age = 0;\n        this.maxAge = 3.0; // 3 segundos de duración\n      }\n\n      update(delta) {\n        this.age += delta;\n        this.radius += this.speed * delta;\n        return this.age \u003c this.maxAge && this.radius \u003c this.maxRadius;\n      }\n\n      draw(ctx) {\n        if (this.radius \u003c= 4) return;\n        const life = Math.max(0, 1 - (this.age / this.maxAge));\n        if (life \u003c= 0.005) return;\n\n        ctx.save();\n        // 4 franjas concéntricas blancas que barren el cielo y el texto\n        const rings = [\n          { rOffset: -30, width: 20, alpha: 0.38 },\n          { rOffset: 0,   width: 9,  alpha: 0.95 }, // Cresta central nítida y brillante\n          { rOffset: 32,  width: 38, alpha: 0.25 },\n          { rOffset: 70,  width: 55, alpha: 0.12 }\n        ];\n\n        for (let s of rings) {\n          const r = this.radius + s.rOffset;\n          if (r \u003c= 2) continue;\n          const a = s.alpha * Math.pow(life, 0.85);\n          if (a \u003c= 0.004) continue;\n\n          ctx.beginPath();\n          ctx.arc(this.originX, this.originY, r, 0, Math.PI * 2);\n          ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1.0, a)})`;\n          ctx.lineWidth = s.width;\n          ctx.stroke();\n        }\n        ctx.restore();\n      }\n    }\n\n    // Estado del cursor interactivo contextual para la fase de loop\n    let mouse = {\n      x: -100,\n      y: -100,\n      targetX: -100,\n      targetY: -100,\n      active: false,\n      hoveringUI: false,\n      scale: 1.0,\n      alpha: 0\n    };\n\n    /* ========================================================\n       ÁTOMOS DE AGUA — fase inicial (0 – 2,4 s) y plegado hacia el núcleo (2,4 s en adelante)\n       Un pequeño racimo de círculos blancos y azules que orbitan juntos el punto donde nacerá la\n       gota. Sin líneas ni estelas: solo los círculos. Movimiento orgánico y lento: órbitas elípticas\n       inclinadas cuyo radio y velocidad ondulan suavemente, un balanceo común del grupo, y el racimo\n       se contrae hacia el centro para guiar la mirada. Al terminar la fase, los MISMOS círculos siguen\n       girando mientras se pliegan en espiral hacia el núcleo (con la convergencia de siempre) y la\n       gota se forma.\n       ======================================================== */\n    const ATOM_STYLES = [\n      // n: cuántos · fill: color SÓLIDO y opaco (sin borde, sin línea y sin sombra) · size: radio mín–máx (px)\n      { n: 4, fill: '#FFFFFF', size: [5.5, 10]  },   // blancos\n      { n: 4, fill: '#00AFAF', size: [4.5, 8.5] },   // azul AUARA\n      { n: 2, fill: '#78D7D7', size: [3.5, 6.5] }    // cristal de agua\n    ];\n\n    /* Velocidad del giro: de LENTA a MUY RÁPIDA a lo largo de la fase (se acelera hasta que\n       se forma la gota). ATOM_V0/ATOM_V1 multiplican la velocidad angular propia de cada círculo. */\n    const ATOM_PHASE_T = 2.4;\n    const ATOM_V0 = 0.30, ATOM_V1 = 2.80;\n    function atomSpeed(t) {                                   // multiplicador instantáneo (rampa cuadrática)\n      const k = Math.min(1, t / ATOM_PHASE_T);\n      return ATOM_V0 + (ATOM_V1 - ATOM_V0) * k * k;\n    }\n    function atomPhase(t) {                                   // ángulo acumulado: integral exacta de atomSpeed\n      const tt = Math.min(t, ATOM_PHASE_T);\n      return ATOM_V0 * tt + (ATOM_V1 - ATOM_V0) * tt * tt * tt / (3 * ATOM_PHASE_T * ATOM_PHASE_T);\n    }\n\n    function setupAtoms() {\n      inflowDots = [];\n      const rnd = Math.random;\n      const groupDir = rnd() \u003c 0.5 ? 1 : -1;                    // el racimo gira, en su mayoría, en un mismo sentido\n      for (const st of ATOM_STYLES) {\n        for (let i = 0; i \u003c st.n; i++) {\n          inflowDots.push({\n            // órbita: elipse inclinada\n            r0: 34 + Math.pow(rnd(), 0.9) * 112,                // racimo compacto: 34–146 px\n            ecc: 0.62 + rnd() * 0.38,\n            tilt: rnd() * Math.PI,\n            w: (0.9 + rnd() * 0.7) * (rnd() \u003c 0.8 ? groupDir : -groupDir),     // rad/s base; atomSpeed() lo acelera\n            th0: rnd() * Math.PI * 2,\n            // irregularidades suaves (radio y velocidad angular ondulan; el centro deriva)\n            a1: 0.07 + rnd() * 0.09, f1: 0.45 + rnd() * 0.6, p1: rnd() * 6.283,\n            a2: 0.02 + rnd() * 0.035, f2: 1.1 + rnd() * 0.9, p2: rnd() * 6.283,\n            ax: 4 + rnd() * 8, fx: 0.3 + rnd() * 0.4, px: rnd() * 6.283,\n            ay: 4 + rnd() * 8, fy: 0.3 + rnd() * 0.4, py: rnd() * 6.283,\n            delay: rnd() * 0.5,                                 // aparecen escalonados\n            // aspecto\n            size: st.size[0] + rnd() * (st.size[1] - st.size[0]),\n            fill: st.fill,\n            // estado\n            x: 0, y: 0, spin: 0, d0: 1,\n            speed: 0.018 + rnd() * 0.03                         // confluencia suave: igual que antes\n          });\n        }\n      }\n    }\n\n    // Escala del racimo según el tamaño de pantalla (en móvil no se sale del lienzo)\n    function atomUnit() {\n      return Math.max(0.45, Math.min(1, Math.min(width, height * 1.1) / 900));\n    }\n\n    // Posición del átomo (relativa al punto de nacimiento de la gota) en el instante t de la fase\n    function placeAtom(p, t, unit) {\n      const k = Math.min(1, t / 2.4);\n      const ease = k * k * (3 - 2 * k);\n      const inward = 1 - 0.45 * ease;                                   // el racimo se contrae hacia el centro\n      const R = p.r0 * unit * inward * (1 + p.a1 * Math.sin(p.f1 * t + p.p1) + p.a2 * Math.sin(p.f2 * t + p.p2));\n      const th = p.th0 + p.w * atomPhase(t) + 0.18 * Math.sin(0.7 * t + p.p1);   // giro acelerado + leve ondulación\n      const ex = R * Math.cos(th), ey = R * p.ecc * Math.sin(th);\n      const ct = Math.cos(p.tilt), sn = Math.sin(p.tilt);\n      p.x = ex * ct - ey * sn + p.ax * unit * Math.sin(p.fx * t + p.px);\n      p.y = ex * sn + ey * ct + p.ay * unit * Math.sin(p.fy * t + p.py);\n      p.spin = p.w * atomSpeed(t) + 0.18 * 0.7 * Math.cos(0.7 * t + p.p1);   // velocidad angular instantánea (rad/s)\n    }\n\n    function drawAtom(cx, cy, p, alpha, sizeScale) {\n      const r = Math.max(0.6, p.size * sizeScale), x = cx + p.x, y = cy + p.y;\n      ctx.save();\n      ctx.globalAlpha = alpha;\n      ctx.beginPath();\n      ctx.arc(x, y, r, 0, Math.PI * 2);\n      ctx.fillStyle = p.fill;                         // relleno sólido; sin trazo ni sombra\n      ctx.fill();\n      ctx.restore();\n    }\n\n    // Fase 0: órbitas (giro que acelera de lento a muy rápido)\n    function drawAtomsOrbit(cx, cy, t) {\n      const unit = atomUnit();\n      // balanceo común: todo el racimo se mece junto, lo que lo hace leerse como un solo cuerpo\n      const gx = 9 * unit * Math.sin(0.55 * t), gy = 7 * unit * Math.sin(0.42 * t + 1.3);\n      for (const p of inflowDots) {\n        placeAtom(p, t, unit);\n        p.x += gx; p.y += gy;\n        const u = Math.min(1, Math.max(0, (t - p.delay) / 0.7));\n        if (u > 0) drawAtom(cx, cy, p, u * u * (3 - 2 * u), Math.max(0.8, unit));\n      }\n    }\n\n    // Al terminar la fase 0: se recuerda a qué distancia está cada átomo (la velocidad angular ya está en p.spin)\n    function beginAtomCollapse() {\n      for (const p of inflowDots) p.d0 = Math.max(1, Math.hypot(p.x, p.y));\n    }\n\n    // Fase 1: plegado en espiral hacia el núcleo\n    function drawAtomsCollapse(cx, cy, dt, t) {\n      const unit = atomUnit();\n      // La atracción llega a su fuerza de siempre en 0,45 s; así el giro de la órbita se curva hacia dentro en espiral\n      const rampIn = Math.min(1, t / 0.45), ramp = 0.15 + 0.85 * rampIn * rampIn * (3 - 2 * rampIn);\n      for (const p of inflowDots) {\n        const k = lerpFactor(p.speed * ramp);          // misma convergencia que antes, con entrada suave\n        p.x += (0 - p.x) * k;\n        p.y += (0 - p.y) * k;\n        const ang = p.spin * dt, c = Math.cos(ang), sn = Math.sin(ang);   // sigue girando mientras se pliega\n        const nx = p.x * c - p.y * sn;\n        p.y = p.x * sn + p.y * c;\n        p.x = nx;\n        p.spin *= Math.pow(0.78, dt);\n        const dist = Math.hypot(p.x, p.y);\n        const shrink = 0.30 + 0.70 * Math.min(1, dist / p.d0);            // se reducen al fundirse con la gota\n        drawAtom(cx, cy, p, Math.min(1, 0.35 + dist / 40), Math.max(0.8, unit) * shrink);\n      }\n    }\n\n    /* Salto directo a la fase de loop con el contenido visible */\n    function enterLoopDirectly() {\n      clearTimeout(impactRevealTimer);\n      impactRevealTimer = null;\n      currentStage = STAGE_LOOP_FLOW;\n      sunbeamIntroTimer = -1;\n      stageTimer = 0;\n      mainDrop = null;\n      inflowDots = [];\n      camera.zoom = 1.0;\n      camera.targetZoom = 1.0;\n      camera.y = height * 0.5;\n      camera.targetY = height * 0.5;\n\n      heroContainer.classList.add('visible');\n      updateSurfacePosition();\n      lastLoopSpawn = animTime;\n      if (isAnimationPaused) drawStillFrame();\n    }\n\n    /* Iniciar o reiniciar la experiencia */\n    function startIntro() {\n      const urlParams = new URLSearchParams(window.location.search);\n      const returningFromCase = urlParams.get('skipIntro') === 'true' || window.location.hash === '#loop' || window.__AUARA_SKIP === true;\n      // La animación completa se reproduce siempre; solo se salta al volver del caso\n      const skipIntro = returningFromCase;\n\n      loopDrops = [];\n      departureWaves = [];\n      mainDrop = null;\n\n      const veil = document.getElementById('page-transition-veil');\n      if (veil) veil.classList.remove('active');\n\n      btnStart.dataset.launching = 'false';\n      btnStart.classList.remove('launching');\n\n      if (skipIntro) {\n        const handoff = returningFromCase ? readHandoff() : null;\n        const calm = window.AUARA_HONOR_REDUCED_MOTION === true && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n        const animateReturn = returningFromCase && !calm && !(handoff && handoff.skip);\n\n        // Continuidad de las olas con la página del caso\n        if (animateReturn && handoff && isFinite(handoff.t)) {\n          animTime = handoff.t + Math.min(2, Math.max(0, (Date.now() - handoff.at) / 1000));\n          lastLoopSpawn = animTime;\n        }\n\n        enterLoopDirectly();\n\n        // Al regresar del caso el agua llega cubriendo la pantalla (como al salir de aquí)\n        // y baja hasta su nivel de reposo; el texto sube cuando el agua ya ha bajado.\n        if (animateReturn) {\n          waterRise.dir = -1;\n          waterRise.t = 1;\n          waterRise.hold = 0.15;\n          waterRise.active = true;\n          appEl.classList.add('leaving');             // botón y controles ocultos mientras el agua cubre\n          heroContainer.classList.remove('visible');\n          setTimeout(() => {\n            heroContainer.classList.add('visible');\n            appEl.classList.remove('leaving');\n          }, 1100);\n        }\n        return;\n      }\n\n      currentStage = STAGE_GRID_ALIGN;\n      sunbeamIntroTimer = -1;\n      stageTimer = 0;\n      camera.zoom = 0.82;\n      camera.targetZoom = 1.5;\n      camera.y = height * 0.28;\n      camera.targetY = height * 0.28;\n\n      heroContainer.classList.remove('visible');\n      setupAtoms();\n    }\n\n    startIntro();\n\n    /* ========================================================\n       CLASES GRÁFICAS FLAT (SIN 3D NI REFLEJOS)\n       ======================================================== */\n\n    // Dibuja la icónica gota de agua AUARA en color plano sólido 100% suave y redondeada (cero picos)\n    function drawFlatWaterDrop(ctx, x, y, size, stretch, color) {\n      ctx.save();\n      ctx.translate(x, y);\n      ctx.scale(1 / Math.sqrt(stretch), stretch);\n\n      ctx.fillStyle = color;\n      ctx.beginPath();\n      const tipRadius = size * 0.12;\n      const topY = -size * 1.65;\n      // Vértice superior redondeado con arco suave (sin pico puntiagudo)\n      ctx.moveTo(-tipRadius, topY + tipRadius);\n      ctx.arc(0, topY + tipRadius, tipRadius, Math.PI, 0, false);\n      // Flanco derecho suave y tangente hacia la base semicircular\n      ctx.bezierCurveTo(size * 0.25, -size * 0.9, size * 0.98, -size * 0.05, size, size * 0.5);\n      // Base perfectamente redondeada (semicírculo inferior plano oficial AUARA)\n      ctx.arc(0, size * 0.5, size, 0, Math.PI, false);\n      // Flanco izquierdo tangente de regreso a la cúpula superior\n      ctx.bezierCurveTo(-size * 0.98, -size * 0.05, -size * 0.25, -size * 0.9, -tipRadius, topY + tipRadius);\n      ctx.closePath();\n      ctx.fill();\n\n      ctx.restore();\n    }\n\n    // Gota física con aceleración gravitatoria\n        // ========================================================\n    // ONDA DE DISTORSIÓN FÍSICA Y VELO DE TRANSPARENCIA\n    // ========================================================\n        // ========================================================\n    class DistortionWave {\n      constructor(originX, originY, intensity = 1.0, opts = {}) {\n        this.originX = originX;\n        this.originY = originY;\n        this.radius = 0;\n        // Radio equilibrado y natural: expansión fluida sin saturar\n        this.maxRadius = Math.max(width, height) * (opts.maxRadiusFactor || 1.15);\n        this.speed = opts.speed || 220; // Velocidad fluida y orgánica (220 px/s)\n        this.ringWidth = opts.ringWidth || 150; // Onda amplia y suave\n        this.intensity = intensity;\n        this.age = 0;\n        this.maxAge = opts.maxAge || 2.8; // Duración equilibrada\n        this.minR = 0;\n        this.maxR = 150;\n        this.minRSq = 0;\n        this.maxRSq = 150 * 150;\n      }\n\n      update(delta) {\n        this.age += delta;\n        this.radius += this.speed * delta;\n        this.minR = Math.max(0, this.radius - this.ringWidth);\n        this.maxR = this.radius + this.ringWidth;\n        this.minRSq = this.minR * this.minR;\n        this.maxRSq = this.maxR * this.maxR;\n        return this.age \u003c this.maxAge && this.radius \u003c this.maxRadius;\n      }\n\n      getOffset(x, y) {\n        const dx = x - this.originX;\n        const dy = y - this.originY;\n        const distSq = dx * dx + dy * dy;\n\n        // Descarte cuadrático rápido (descarta 95% de puntos lejanos sin coste)\n        if (distSq \u003c this.minRSq || distSq > this.maxRSq) return 0;\n\n        const dist = Math.sqrt(distSq);\n        const distFromFront = dist - this.radius;\n\n        // Ventana de Hann continua C1/C2 (garantiza cero picos o quiebres)\n        const norm = Math.abs(distFromFront) / this.ringWidth;\n        const envelope = 0.5 * (1.0 + Math.cos(norm * Math.PI));\n\n        // Oscilación hidrodinámica armónica amplia y fluida\n        const phase = (distFromFront / this.ringWidth) * Math.PI * 2.0;\n        const wave = -Math.sin(phase) * envelope;\n\n        const lifeFactor = Math.max(0, 1 - (this.age / this.maxAge));\n        // Amplitud calibrada (18px): perceptible, elegante y sin excesos\n        const amp = 18 * this.intensity * Math.pow(lifeFactor, 1.2);\n\n        return wave * amp;\n      }\n\n      // Ondas blancas limpias, equilibradas y en armonía con la identidad visual\n      drawFranjasBlancas(ctx, waterTopY) {\n        if (this.radius \u003c= 6) return;\n        const lifeFactor = Math.max(0, 1 - (this.age / this.maxAge));\n        if (lifeFactor \u003c= 0.006) return;\n\n        ctx.save();\n        // Recorte para la masa de agua inferior adaptado al relieve topográfico\n        ctx.beginPath();\n        ctx.rect(-500, waterTopY - 120, width + 1000, height + 1400);\n        ctx.clip();\n\n        // 3 franjas concéntricas bien ponderadas: nítidas, limpias y de grosor equilibrado\n        const stripes = [\n          { rOffset: -24, width: 14, baseAlpha: 0.28 }, // Franja interna media\n          { rOffset: 0,   width: 7,  baseAlpha: 0.70 }, // Cresta central nítida y definida\n          { rOffset: 26,  width: 26, baseAlpha: 0.16 }  // Halo externo suave\n        ];\n\n        for (let s of stripes) {\n          const r = this.radius + s.rOffset;\n          if (r \u003c= 2) continue;\n          const a = s.baseAlpha * Math.pow(lifeFactor, 1.15) * Math.min(1.2, this.intensity);\n          if (a \u003c= 0.005) continue;\n\n          ctx.beginPath();\n          ctx.arc(this.originX, this.originY, r, 0, Math.PI * 2);\n          ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1.0, a)})`;\n          ctx.lineWidth = s.width;\n          ctx.stroke();\n        }\n\n        ctx.restore();\n      }\n    }\n\n\n\n    class FlatDrop {\n      constructor(x, y, targetY, isMain = false) {\n        this.x = x;\n        this.y = y;\n        this.targetY = targetY;\n        this.vy = isMain ? 0.4 : 1.8;\n        this.gravity = isMain ? 0.38 : 0.48;\n        this.size = isMain ? 18 : 10;\n        this.stretch = 1.0;\n        this.isMain = isMain;\n      }\n\n      update() {\n        // Escalado por frameScale: misma velocidad a 60, 90 o 120 Hz\n        this.vy += this.gravity * frameScale;\n        this.y += this.vy * frameScale;\n        // Elongación hidrodinámica suave y armónica (máximo 1.45 para mantener redondez orgánica)\n        this.stretch = Math.min(1.45, 1 + this.vy * 0.028);\n\n        if (this.y >= this.targetY) {\n          triggerFlatImpact(this.x, this.targetY, this.vy, this.isMain);\n          return false;\n        }\n        return true;\n      }\n\n      draw() {\n        // Color plano oficial de AUARA: #00AFAF (sin brillo ni textura)\n        drawFlatWaterDrop(ctx, this.x, this.y, this.size, this.stretch, '#00AFAF');\n      }\n    }\n\n        /* Disparador de impacto */\n    function triggerFlatImpact(x, y, vy, isMain) {\n      // 1. Onda de distorsión fluida, equilibrada y armónica (sin estridencias).\n      //    Intensidad contenida (1,75) y radio/anillo por defecto (×1,15 · 150 px): el descarte\n      //    cuadrático inicial ignora ~95 % de los puntos y apenas cuesta CPU.\n      const intensity = isMain ? 1.75 : 1.25;\n      distortionWaves.push(new DistortionWave(x, y, intensity));\n\n      if (isMain) {\n        // Revelación fluida del contenido (texto + botón como módulo unificado), APLAZADA 180 ms\n        // (~11 fotogramas): así la onda, los rayos y el cambio de estilos del texto no coinciden\n        // en el mismo fotograma y ni la CPU ni la GPU se saturan en el instante del contacto.\n        clearTimeout(impactRevealTimer);\n        impactRevealTimer = setTimeout(() => {\n          impactRevealTimer = null;\n          sunbeamIntroTimer = 0;                    // Disparar la animación dramática de rayos al nacer el loop\n          heroContainer.classList.add('visible');   // El texto sube desde abajo y pasa de 0 a 100 % de opacidad\n          updateSurfacePosition();                  // Recalcular posición del módulo\n        }, 180);\n      }\n    }\n\n    /* ========================================================\n       BUCLE PRINCIPAL DE ANIMACIÓN CINEMÁTICA FLAT\n       ======================================================== */\n        // ========================================================\n    // ========================================================\n    // ILUMINACIÓN DEL CIELO: RAYOS DE SOL DRAMÁTICOS AL INICIO DEL LOOP\n    // (Animación exclusiva al comienzo del loop, blanco puro, cero amarillo)\n    // ========================================================\n    const sunbeams = [\n      // Haces principales potentes de alto contraste\n      { baseAngle: Math.PI * 0.50, spread: 0.28, baseAlpha: 0.95, speed: 0.0008, phase: 0.0 },\n      { baseAngle: Math.PI * 0.44, spread: 0.18, baseAlpha: 0.85, speed: 0.0006, phase: 1.1 },\n      { baseAngle: Math.PI * 0.56, spread: 0.18, baseAlpha: 0.85, speed: 0.0007, phase: 2.3 },\n\n      // Haces finos intensos (grietas de luz pura)\n      { baseAngle: Math.PI * 0.47, spread: 0.07, baseAlpha: 0.98, speed: 0.0012, phase: 0.5 },\n      { baseAngle: Math.PI * 0.53, spread: 0.07, baseAlpha: 0.98, speed: 0.0014, phase: 3.1 },\n      { baseAngle: Math.PI * 0.41, spread: 0.06, baseAlpha: 0.82, speed: 0.0010, phase: 4.2 },\n      { baseAngle: Math.PI * 0.59, spread: 0.06, baseAlpha: 0.82, speed: 0.0011, phase: 1.8 },\n\n      // Haces en abanico abierto hacia los extremos\n      { baseAngle: Math.PI * 0.35, spread: 0.22, baseAlpha: 0.65, speed: 0.0005, phase: 4.8 },\n      { baseAngle: Math.PI * 0.65, spread: 0.22, baseAlpha: 0.65, speed: 0.0004, phase: 5.7 }\n    ];\n\n    /* ========================================================\n       RAYOS DE SOL — UNA IMAGEN PRECALCULADA Y UN SOLO drawImage POR FOTOGRAMA\n       Son luz difusa: se dibujan UNA vez, a ~1/3 de resolución y solo en la franja del cielo,\n       en un canvas fuera de pantalla. Cada fotograma se pintan con un único drawImage con\n       opacidad y escala, dentro del mismo lienzo del agua (que los tapa bajo la superficie).\n       Sin recortes, sin degradados nuevos y sin capas extra en el compositor: hacer visible\n       una capa de pantalla completa justo en el impacto obligaba al navegador a crearla y\n       subirla en ese fotograma.\n       ======================================================== */\n    const SUNBEAM_RES = 0.35;                    // resolución del precálculo respecto a la pantalla\n    // var (no let): resize() se ejecuta antes de esta línea y la consulta; con let fallaría (zona muerta temporal)\n    var sunbeamsCanvas = null, sunbeamsSkyH = 0;\n\n    function buildSunbeamsLayer() {\n      // Solo hace falta el cielo: bajo la superficie el agua los tapa\n      sunbeamsSkyH = Math.max(1, Math.min(height, (staticSurfaceY || height * 0.58) + 160));\n      if (!sunbeamsCanvas) sunbeamsCanvas = document.createElement('canvas');\n      sunbeamsCanvas.width = Math.max(1, Math.round(width * SUNBEAM_RES));\n      sunbeamsCanvas.height = Math.max(1, Math.round(sunbeamsSkyH * SUNBEAM_RES));\n      const c = sunbeamsCanvas.getContext('2d');\n      c.setTransform(SUNBEAM_RES, 0, 0, SUNBEAM_RES, 0, 0);\n      c.clearRect(0, 0, width, sunbeamsSkyH);\n\n      const ox = width / 2, oy = -100;           // origen del sol, fuera de pantalla por arriba\n      const len = height * 1.5;                  // longitud máxima de los haces\n\n      // Foco / fulgor cenital\n      const glow = c.createRadialGradient(ox, oy, 0, ox, oy, 260);\n      glow.addColorStop(0, 'rgba(255, 255, 255, 0.9)');\n      glow.addColorStop(0.5, 'rgba(255, 255, 255, 0.45)');\n      glow.addColorStop(1, 'rgba(255, 255, 255, 0)');\n      c.fillStyle = glow;\n      c.beginPath();\n      c.arc(ox, oy, 260, 0, Math.PI * 2);\n      c.fill();\n\n      // Haces en blanco puro (ángulo y apertura medios del original; el pulso pasa a la opacidad)\n      for (const b of sunbeams) {\n        const half = b.spread * 0.92;\n        const grad = c.createLinearGradient(ox, oy, ox + Math.cos(b.baseAngle) * len, oy + Math.sin(b.baseAngle) * len);\n        grad.addColorStop(0, `rgba(255, 255, 255, ${b.baseAlpha * 0.90})`);\n        grad.addColorStop(0.25, `rgba(255, 255, 255, ${b.baseAlpha * 0.65})`);\n        grad.addColorStop(0.65, `rgba(255, 255, 255, ${b.baseAlpha * 0.25})`);\n        grad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');\n        c.fillStyle = grad;\n        c.beginPath();\n        c.moveTo(ox, oy);\n        c.lineTo(ox + Math.cos(b.baseAngle - half) * len, oy + Math.sin(b.baseAngle - half) * len);\n        c.lineTo(ox + Math.cos(b.baseAngle + half) * len, oy + Math.sin(b.baseAngle + half) * len);\n        c.closePath();\n        c.fill();\n      }\n\n      // Precalentar: el primer uso de esta imagen la sube a la tarjeta gráfica; mejor ahora que en el\n      // impacto (1 píxel casi transparente que se borra en el siguiente fotograma)\n      ctx.save();\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      ctx.globalAlpha = 0.004;\n      ctx.drawImage(sunbeamsCanvas, 0, 0, 1, 1);\n      ctx.restore();\n    }\n\n    // Por fotograma: un drawImage con opacidad y escala (la cámara ya está aplicada en ctx)\n    function updateSunbeamsLayer(now) {\n      if (!sunbeamsCanvas || sunbeamIntroTimer \u003c 0 || sunbeamIntroTimer > 4.6) return;\n\n      // Curva envolvente dramática: irrupción veloz -> clímax luminoso -> desvanecimiento elegante\n      let envelope;\n      if (sunbeamIntroTimer \u003c 0.7) {\n        envelope = Math.sin((sunbeamIntroTimer / 0.7) * Math.PI * 0.5);\n      } else if (sunbeamIntroTimer \u003c 2.5) {\n        envelope = 1.0;\n      } else {\n        envelope = 0.5 * (1.0 + Math.cos(((sunbeamIntroTimer - 2.5) / 2.1) * Math.PI));\n      }\n      const alpha = envelope * (0.8 + 0.1 * Math.sin(now * 0.0009));\n      if (alpha \u003c= 0.003) return;\n\n      // Crecimiento vertical en la entrada = escalar el abanico respecto a su vértice\n      const grow = Math.max(0.001, Math.sin(Math.min(1.0, sunbeamIntroTimer / 0.65) * Math.PI * 0.5));\n      const ox = width / 2, oy = -100;\n      ctx.save();\n      ctx.globalAlpha = Math.min(1, alpha);\n      ctx.translate(ox, oy);\n      ctx.scale(grow, grow);\n      ctx.translate(-ox, -oy);\n      ctx.drawImage(sunbeamsCanvas, 0, 0, width, sunbeamsSkyH);\n      ctx.restore();\n    }\n    buildSunbeamsLayer();     // listo antes del impacto: no se construye en el fotograma crítico\n\n    /* ========================================================\n       RELIEVE TOPOGRÁFICO MARINO (LIQUID SCANLINES OP-ART)\n       Inspirado en cartelería gráfica editorial con trenes de olas continuas\n       ======================================================== */\n    function getTopologicalHeight(x, y, time, progress = 0) {\n      const refSurfaceY = staticSurfaceY || (height * 0.52);\n      const depth = Math.max(0, y - refSurfaceY);\n\n      // --- 1. TRENES DE OLAS OCEÁNICAS CONTINUAS (Movimiento fluido dinámico) ---\n      // Onda primaria oceánica de largo recorrido: cresta trocoidal afilada (Stokes)\n      const k1 = 0.0036;\n      const phase1 = x * k1 - time * 0.95;\n      const s1 = Math.sin(phase1);\n      const wave1 = Math.sign(s1) * Math.pow(Math.abs(s1), 0.68) * (24 * (1 - progress * 0.35));\n\n      // Mar de fondo cruzado (interferencia hidrodinámica fluida que crea bolsas y valles orgánicos)\n      const k2 = 0.0078;\n      const phase2 = x * k2 + time * 1.35 + depth * 0.005;\n      const wave2 = Math.cos(phase2) * (14 * (1 - progress * 0.4));\n\n      // Rizo superficial de alta frecuencia (ondulación capilar viva en el horizonte de agua)\n      const k3 = 0.016;\n      const phase3 = x * k3 - time * 2.2 + Math.cos(phase1) * 0.8;\n      const wave3 = Math.sin(phase3) * (6 * Math.max(0, 1 - progress * 2.2));\n\n      // --- 2. GRANDES CRESTAS Y ONDULACIONES ESCULTÓRICAS (ESTÉTICA CARTEL UNIT) ---\n      // A) Crestas superiores prominentes (visibles en el tercio superior de las ondas)\n      const p1X = width * 0.35 + Math.sin(time * 0.5) * (width * 0.04);\n      const d1x = (x - p1X) / (width * 0.16);\n      const topPeak1 = (36 * Math.max(0, 1 - progress * 2.5)) * Math.exp(-d1x * d1x) * (1 - 0.28 * Math.tanh(2.5 * d1x));\n\n      const p2X = width * 0.77 + Math.cos(time * 0.42) * (width * 0.035);\n      const d2x = (x - p2X) / (width * 0.13);\n      const topPeak2 = (32 * Math.max(0, 1 - progress * 2.5)) * Math.exp(-d2x * d2x) * (1 + 0.32 * Math.tanh(2.8 * d2x));\n\n      // B) Oleaje profundo con pliegues líquidos (crece en el plano medio e inferior como en UNIT)\n      const midWeight = Math.sin(progress * Math.PI); // máximo en el centro del oleaje\n\n      // Gran masa de oleaje izquierdo con frente escarpado (pliegue y compresión de ola)\n      const pDeepLX = width * 0.28 + Math.sin(time * 0.45 + 1.2) * (width * 0.05);\n      const dDeepLX = (x - pDeepLX) / (width * 0.19);\n      const swellLeft = (46 * midWeight) * Math.exp(-dDeepLX * dDeepLX) * (1 - 0.45 * Math.tanh(3.2 * dDeepLX));\n\n      // Masa de oleaje central-derecho con relieve sinuoso\n      const pDeepRX = width * 0.65 + Math.cos(time * 0.38 + 2.1) * (width * 0.06);\n      const dDeepRX = (x - pDeepRX) / (width * 0.17);\n      const swellRight = (42 * midWeight) * Math.exp(-dDeepRX * dDeepRX) * (1 + 0.38 * Math.tanh(2.6 * dDeepRX));\n\n      // Modulación líquida armónica en el plano inferior\n      const depthHarmonic = Math.sin(x * 0.0055 + progress * 5.0 - time * 0.9) * (12 * midWeight);\n\n      return wave1 + wave2 + wave3 + topPeak1 + topPeak2 + swellLeft + swellRight + depthHarmonic;\n    }\n\n    /* ========================================================\n       RELIEVE POR COLUMNAS\n       La mayor parte de getTopologicalHeight depende solo de x y del tiempo, no de la\n       línea. Antes se recalculaba 48 veces por columna y fotograma (~12.000 llamadas con\n       senos, exponenciales y tangentes hiperbólicas). Ahora esas partes se calculan UNA vez\n       por columna (~250) y cada línea solo las combina con sus pesos. El resultado es\n       matemáticamente idéntico: la fase que sí depende de la profundidad se separa con\n       identidades de suma de ángulos (cos(A+B), sin(A+B)).\n       ======================================================== */\n    let rcN = 0, rcW1, rcCos2, rcSin2, rcW3, rcPk1, rcPk2, rcSwL, rcSwR, rcCos5, rcSin5;\n    let ptsY = new Float64Array(0);     // se reutiliza: ya no se crean ~12.000 objetos {x,y} por fotograma\n\n    function buildReliefColumns(n, x0, stepX, time) {\n      if (n > rcN) {\n        rcN = n;\n        rcW1 = new Float64Array(n); rcCos2 = new Float64Array(n); rcSin2 = new Float64Array(n);\n        rcW3 = new Float64Array(n); rcPk1 = new Float64Array(n); rcPk2 = new Float64Array(n);\n        rcSwL = new Float64Array(n); rcSwR = new Float64Array(n);\n        rcCos5 = new Float64Array(n); rcSin5 = new Float64Array(n);\n      }\n      const p1X = width * 0.35 + Math.sin(time * 0.5) * (width * 0.04);\n      const p2X = width * 0.77 + Math.cos(time * 0.42) * (width * 0.035);\n      const pLX = width * 0.28 + Math.sin(time * 0.45 + 1.2) * (width * 0.05);\n      const pRX = width * 0.65 + Math.cos(time * 0.38 + 2.1) * (width * 0.06);\n      const w1 = width * 0.16, w2 = width * 0.13, wL = width * 0.19, wR = width * 0.17;\n      for (let j = 0; j \u003c n; j++) {\n        const x = x0 + j * stepX;\n        const phase1 = x * 0.0036 - time * 0.95;\n        const s1 = Math.sin(phase1);\n        rcW1[j] = Math.sign(s1) * Math.pow(Math.abs(s1), 0.68);\n        const a2 = x * 0.0078 + time * 1.35;\n        rcCos2[j] = Math.cos(a2); rcSin2[j] = Math.sin(a2);\n        rcW3[j] = Math.sin(x * 0.016 - time * 2.2 + Math.cos(phase1) * 0.8);\n        const d1 = (x - p1X) / w1; rcPk1[j] = Math.exp(-d1 * d1) * (1 - 0.28 * Math.tanh(2.5 * d1));\n        const d2 = (x - p2X) / w2; rcPk2[j] = Math.exp(-d2 * d2) * (1 + 0.32 * Math.tanh(2.8 * d2));\n        const dL = (x - pLX) / wL; rcSwL[j] = Math.exp(-dL * dL) * (1 - 0.45 * Math.tanh(3.2 * dL));\n        const dR = (x - pRX) / wR; rcSwR[j] = Math.exp(-dR * dR) * (1 + 0.38 * Math.tanh(2.6 * dR));\n        const a5 = x * 0.0055 - time * 0.9;\n        rcCos5[j] = Math.cos(a5); rcSin5[j] = Math.sin(a5);\n      }\n    }\n\n    // Elevación de UNA línea (equivale a getTopologicalHeight(x, baseY, time, progress) en todas las columnas)\n    function fillLineElevation(out, n, progress, baseY, refSurfaceY) {\n      const mid = Math.sin(progress * Math.PI);\n      const a1 = 24 * (1 - progress * 0.35);\n      const a2 = 14 * (1 - progress * 0.4);\n      const a3 = 6 * Math.max(0, 1 - progress * 2.2);\n      const peak = Math.max(0, 1 - progress * 2.5);\n      const aP1 = 36 * peak, aP2 = 32 * peak;\n      const aL = 46 * mid, aR = 42 * mid, aH = 12 * mid;\n      const B2 = Math.max(0, baseY - refSurfaceY) * 0.005;\n      const cB2 = Math.cos(B2), sB2 = Math.sin(B2);\n      const B5 = progress * 5.0;\n      const cB5 = Math.cos(B5), sB5 = Math.sin(B5);\n      for (let j = 0; j \u003c n; j++) {\n        let e = a1 * rcW1[j]\n              + a2 * (rcCos2[j] * cB2 - rcSin2[j] * sB2)\n              + aH * (rcSin5[j] * cB5 + rcCos5[j] * sB5);\n        if (a3 > 0) e += a3 * rcW3[j];\n        if (peak > 0) e += aP1 * rcPk1[j] + aP2 * rcPk2[j];\n        if (mid > 0) e += aL * rcSwL[j] + aR * rcSwR[j];\n        out[j] = e;\n      }\n    }\n\n    function render(now) {\n      const realDelta = Math.min(Math.max((now - lastTimestamp) / 1000, 0), MAX_DELTA);\n      lastTimestamp = now;\n\n      // Sin cámara lenta artificial: la física avanza siempre en tiempo real (a 60 fps ≈ 16,7 ms por fotograma).\n      // Frenar el tiempo al 15 % antes del impacto dejaba el movimiento por debajo de 0,1 px por fotograma,\n      // y el ojo lo percibe como un congelamiento del navegador, no como cámara lenta.\n      const delta = realDelta;\n\n      // Subida del agua (tiempo real)\n      if (waterRise.active) {\n        if (waterRise.hold > 0) {\n          waterRise.hold -= realDelta;\n        } else {\n          waterRise.t = Math.max(0, Math.min(1, waterRise.t + waterRise.dir * realDelta / waterRise.duration));\n          // Al volver del caso, cuando el agua termina de bajar se reanuda el loop normal\n          if (waterRise.dir \u003c 0 && waterRise.t \u003c= 0) { waterRise.active = false; waterRise.dir = 1; }\n        }\n      }\n\n      frameScale = delta * 60;\n      animTime += delta;\n      if (sunbeamIntroTimer >= 0) sunbeamIntroTimer += delta;\n      stageTimer += delta;\n\n      // Interpolación suave y orgánica de cámara (efecto cinemático de subida y bajada del agua)\n      const camK = lerpFactor(0.038);\n      camera.zoom += (camera.targetZoom - camera.zoom) * camK;\n      camera.y += (camera.targetY - camera.y) * camK;\n\n      ctx.save();\n      ctx.clearRect(0, 0, width, height);\n\n      const centerX = width / 2;\n      const genesisY = height * 0.28;\n      // Cota de reposo física de la superficie (inmune a reflows de CSS).\n      // Al pulsar Start sube hasta salir por arriba y el agua llena la pantalla.\n      const restSurfaceY = staticSurfaceY || (height * 0.52);\n      const riseT = waterRise.t;\n      const riseEase = riseT \u003c 0.5 ? 4 * riseT * riseT * riseT : 1 - Math.pow(-2 * riseT + 2, 3) / 2;\n      const surfaceY = restSurfaceY - riseEase * (restSurfaceY + 120);\n\n      // Transformación cinemática global: produce la subida y bajada armónica del agua\n      ctx.translate(centerX, camera.y);\n      ctx.scale(camera.zoom, camera.zoom);\n      ctx.translate(-centerX, -camera.y);\n\n      // Iluminación solar en el cielo (haces de luz blanca filtrada en el cielo)\n      updateSunbeamsLayer(animTime * 1000);\n\n      /* --------------------------------------------------------\n         FASE 0: ÁTOMOS DE AGUA ORBITANDO (0s - 2.4s)\n         -------------------------------------------------------- */\n      if (currentStage === STAGE_GRID_ALIGN) {\n        // Átomos de agua orbitando el punto donde nacerá la gota (reemplazan a las líneas radiales y la cruz)\n        drawAtomsOrbit(centerX, genesisY, stageTimer);\n\n        if (stageTimer > 2.4) {\n          beginAtomCollapse();\n          currentStage = STAGE_CONDENSE;\n          stageTimer = 0;\n          camera.targetZoom = 1.85; // Zoom in intenso hacia el nacimiento de la gota\n          camera.targetY = genesisY;\n        }\n      }\n\n      /* --------------------------------------------------------\n         FASE 1: CONDENSACIÓN FLAT Y FORMACIÓN (2.4s - 5.0s)\n         -------------------------------------------------------- */\n      else if (currentStage === STAGE_CONDENSE) {\n        // Los átomos continúan su giro y se pliegan en espiral hacia el núcleo\n        drawAtomsCollapse(centerX, genesisY, delta, stageTimer);\n\n        // Formación progresiva de la gota en color plano puro\n        const growT = Math.min(1, stageTimer / 2.4);\n        const currentSize = 2 + growT * 16;\n        const pulse = Math.sin(stageTimer * 10) * (growT * 1.5);\n\n        // Membrana líquida de tensión elástica y micro-destello en la cúspide\n        if (stageTimer > 0.8) {\n          const auraScale = 1.16 + Math.sin(stageTimer * 9) * 0.06;\n          ctx.save();\n          drawFlatWaterDrop(ctx, centerX, genesisY, currentSize * auraScale, 1.0 + pulse * 0.06, 'rgba(0, 175, 175, 0.16)');\n          ctx.restore();\n\n          if (stageTimer > 1.5) {\n            const sparkAlpha = Math.min(1.0, (stageTimer - 1.5) / 0.8);\n            const sparkSize = 4.5 + Math.sin(stageTimer * 12) * 1.5;\n            const topY = genesisY - (currentSize * 1.7 * (1.0 + pulse * 0.05));\n            ctx.save();\n            ctx.strokeStyle = `rgba(255, 255, 255, ${sparkAlpha * 0.85})`;\n            ctx.lineWidth = 1.2;\n            ctx.beginPath();\n            ctx.moveTo(centerX - sparkSize, topY);\n            ctx.lineTo(centerX + sparkSize, topY);\n            ctx.moveTo(centerX, topY - sparkSize);\n            ctx.lineTo(centerX, topY + sparkSize);\n            ctx.stroke();\n            ctx.restore();\n          }\n        }\n\n        // DIBUJO DE LA GOTA: 100% FLAT (color sólido #00AFAF, cero 3D)\n        drawFlatWaterDrop(ctx, centerX, genesisY, currentSize, 1.0 + pulse * 0.05, '#00AFAF');\n\n        if (stageTimer > 2.5) {\n          currentStage = STAGE_FREE_FALL;\n          stageTimer = 0;\n          const targetSurfaceY = getCurvedSurfaceY(centerX, surfaceY);\n          mainDrop = new FlatDrop(centerX, genesisY, targetSurfaceY, true);\n          // La cámara sigue el descenso de la gota hacia la superficie -> EL AGUA SUBE (\"subida del agua\")\n          camera.targetZoom = 1.25;\n          camera.targetY = targetSurfaceY - 45;\n        }\n      }\n\n      /* --------------------------------------------------------\n         FASE 2: CAÍDA LIBRE Y CÁMARA DESCENDENTE (5.0s - 6.5s)\n         -------------------------------------------------------- */\n      else if (currentStage === STAGE_FREE_FALL) {\n        // Línea vertical que marca el cauce de caída\n        ctx.save();\n        ctx.strokeStyle = 'rgba(0, 175, 175, 0.25)';\n        ctx.lineWidth = 1;\n        ctx.setLineDash([4, 6]);\n        ctx.beginPath();\n        ctx.moveTo(centerX, genesisY);\n        ctx.lineTo(centerX, getCurvedSurfaceY(centerX, surfaceY));\n        ctx.stroke();\n        ctx.restore();\n\n        if (mainDrop) {\n          const alive = mainDrop.update();\n          mainDrop.draw();\n          if (!alive) {\n            mainDrop = null;\n            currentStage = STAGE_IMPACT_BURST;\n            stageTimer = 0;\n            // Al impactar: la cámara se eleva amortiguadamente al encuadre general -> EL AGUA BAJA (\"bajada del agua\")\n            camera.targetZoom = 1.0;\n            camera.targetY = height * 0.5;\n          }\n        }\n      }\n\n      /* --------------------------------------------------------\n         FASE 3: IMPACTO Y EXPANSION (6.5s - 8.5s)\n         -------------------------------------------------------- */\n      else if (currentStage === STAGE_IMPACT_BURST) {\n        if (stageTimer > 2.2) {\n          currentStage = STAGE_LOOP_FLOW;\n          stageTimer = 0;\n          lastLoopSpawn = animTime; // Primera gota del loop espera el intervalo completo\n        }\n      }\n\n      /* --------------------------------------------------------\n         FASE 4: LOOP CONTINUO Y EQUILIBRADO (8.5s en adelante)\n         -------------------------------------------------------- */\n      else if (currentStage === STAGE_LOOP_FLOW) {\n        // Caída periódica: la gota cae desde bien arriba (fuera de la pantalla: y = -50) atravesando todo el lienzo\n        if (!waterRise.active && animTime - lastLoopSpawn > 3.4) {\n          loopDrops.push(new FlatDrop(centerX, -50, getCurvedSurfaceY(centerX, surfaceY), false));\n          lastLoopSpawn = animTime;\n        }\n      }\n\n      /* --------------------------------------------------------\n         SUPERFICIE DEL AGUA: EN MEDIO DE START Y PAUSE, CON DISTORSIÓN FÍSICA Y TRANSPARENCIA\n         -------------------------------------------------------- */\n      // La superficie ondulada está situada justo sobre el botón Start, donde cae la gota\n\n      // Actualizar ondas de distorsión\n      for (let i = distortionWaves.length - 1; i >= 0; i--) {\n        if (!distortionWaves[i].update(delta)) {\n          distortionWaves.splice(i, 1);\n        }\n      }\n\n      ctx.save();\n      /* --------------------------------------------------------\n         TRAMA DE RELIEVE TOPOGRÁFICO PARAMÉTRICO (OP-ART SCANLINES)\n         Inspirado en cartelería gráfica editorial con jerarquía de grosores\n         -------------------------------------------------------- */\n      const topY = surfaceY;\n      const bottomY = height + 40; // cubre hasta fuera del borde — sin franja blanca inferior\n      const totalLines = 48;\n      const stepY = (bottomY - topY) / (totalLines - 1);\n      const stepX = width \u003c 768 ? 9 : 6;                       // menos puntos en pantallas estrechas: mismo aspecto, mucho menos cálculo\n      const nCols = Math.floor((width + 80) / stepX) + 1;       // columnas x = -40 … width+40\n      const refSurfaceY = staticSurfaceY || (height * 0.52);\n      if (ptsY.length \u003c nCols) ptsY = new Float64Array(nCols);\n\n      ctx.lineCap = 'round';\n      ctx.lineJoin = 'round';\n\n      // Partes del relieve que no dependen de la línea: una vez por columna y fotograma\n      buildReliefColumns(nCols, -40, stepX, animTime);\n\n      // Dibujar de fondo hacia primer plano (arriba hacia abajo)\n      // Cada línea ocluye lo que queda detrás rellenando con el color de fondo (#EEF4F3)\n      for (let i = 0; i \u003c totalLines; i++) {\n        const baseY = topY + i * stepY;\n        const progress = i / (totalLines - 1); // 0 (horizonte superior) a 1 (base inferior)\n\n        // Contraste máximo: de 0.7px en el horizonte a 11px en la base\n        ctx.lineWidth = 0.7 + Math.pow(progress, 1.2) * 10.3;\n\n        // Color cian/turquesa AUARA de alto contraste y saturación editorial\n        const g = Math.round(175 - progress * 35);\n        const b = Math.round(175 - progress * 15);\n        ctx.strokeStyle = `rgb(0, ${g}, ${b})`;\n\n        // Amortiguación suave hacia la base para que las líneas inferiores sean horizontales limpias\n        const damp = Math.max(0, 1 - Math.pow(progress, 2.8));\n\n        fillLineElevation(ptsY, nCols, progress, baseY, refSurfaceY);\n        for (let j = 0; j \u003c nCols; j++) {\n          const x = -40 + j * stepX;\n          let actualY = baseY - (ptsY[j] * damp);\n\n          // Distorsión física viva de las ondas provocadas por impactos de gotas\n          for (let k = 0; k \u003c distortionWaves.length; k++) {\n            actualY += distortionWaves[k].getOffset(x, actualY);\n          }\n          ptsY[j] = actualY;\n        }\n\n        // La curva se construye una sola vez; el área de relleno es una copia con el cierre\n        const curve = new Path2D();\n        curve.moveTo(-40, ptsY[0]);\n        for (let j = 1; j \u003c nCols; j++) curve.lineTo(-40 + j * stepX, ptsY[j]);\n        const area = new Path2D(curve);\n        area.lineTo(width + 80, height + 300);\n        area.lineTo(-80, height + 300);\n        area.closePath();\n\n        // 1. Relleno opaco del fondo (#EEF4F3) debajo de la curva para crear oclusión 3D limpia\n        ctx.fillStyle = '#EEF4F3';\n        ctx.fill(area);\n\n        // 2. Trazo de la línea gráfica\n        ctx.stroke(curve);\n      }\n\n      // Franjas blancas circulares de impacto\n      for (let dw of distortionWaves) {\n        dw.drawFranjasBlancas(ctx, topY);\n      }\n      ctx.restore();\n\n      /* --------------------------------------------------------\n         ACTUALIZAR Y PINTAR ENTIDADES FLAT\n         -------------------------------------------------------- */\n      // Gotas del loop continuo\n      for (let i = loopDrops.length
